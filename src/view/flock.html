<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="sd-token" content="__SD_TOKEN__">
<title>sheepdog flock</title>
<style>
:root {
  --bg: #eef1f3; --surface: #ffffff; --ink: #17212a; --muted: #5a6670; --line: #d3dade;
  --you: #a87414; --agent: #b0532b; --run: #4c7d36; --wait: #3d6fa8; --red: #c2412d; --done: #7d8a93;
  --f-body: "Atkinson Hyperlegible", "Avenir Next", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181d; --surface: #1a2229; --ink: #e4eaee; --muted: #9aa7b1; --line: #2c3740;
    --you: #d9a443; --agent: #e0835a; --run: #7fb465; --wait: #6f9fd6; --red: #ef7a62; --done: #75828c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12181d; --surface: #1a2229; --ink: #e4eaee; --muted: #9aa7b1; --line: #2c3740;
  --you: #d9a443; --agent: #e0835a; --run: #7fb465; --wait: #6f9fd6; --red: #ef7a62; --done: #75828c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; }
.wrap {
  max-width: 1200px; margin: 0 auto; display: grid; gap: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
h2 { font-size: 1rem; margin: 0; display: flex; align-items: center; gap: 8px; }
h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gc); }
h2 .n { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.eyebrow { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.eyebrow.stale { color: var(--red); }
.nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.nav a { font-size: 0.88rem; color: var(--muted); text-decoration: none; }
.nav a:hover { color: var(--ink); }
.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.sum { display: inline-flex; gap: 8px; align-items: baseline; border: 1.5px solid var(--sc); border-radius: 999px; padding: 4px 12px; font-size: 0.88rem; }
.sum b { font-size: 1.15rem; color: var(--sc); font-variant-numeric: tabular-nums; }
.group { display: grid; gap: 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--cc); border-radius: 8px;
  padding: 12px 12px 10px; display: grid; gap: 8px; align-content: start; min-width: 0;
}
.card .b { font-family: var(--f-mono); font-weight: 600; font-size: 0.86rem; overflow-wrap: anywhere; }
.meta { font-size: 0.76rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.meta a { color: var(--muted); }
.now { font-size: 0.82rem; border-radius: 5px; padding: 6px 8px; background: color-mix(in srgb, var(--cc) 12%, transparent); display: grid; gap: 4px; overflow-wrap: anywhere; }
.now .cmd { display: flex; gap: 6px; align-items: center; }
.now code { font-family: var(--f-mono); font-size: 0.74rem; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; overflow-wrap: anywhere; }
.copy { font: inherit; font-size: 0.7rem; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 3px; padding: 1px 6px; cursor: pointer; }
.copy:focus-visible { outline: 2px solid var(--wait); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; }
.step { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; min-height: 22px; position: relative; font-size: 0.8rem; }
.step::before { content: ""; position: absolute; left: 8px; top: -6px; height: 12px; width: 2px; background: var(--line); }
.step:first-child::before { display: none; }
.step.done::before, .step.done + .step::before { background: var(--done); }
.mk { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); justify-self: center; position: relative; z-index: 1; display: grid; place-items: center; }
.step .lab { color: var(--muted); }
.step .st { font-size: 0.72rem; color: var(--muted); text-align: right; font-family: var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
.step.done .mk { background: var(--done); border-color: var(--done); }
.step.done .mk::after { content: ""; width: 4px; height: 7px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.step.done .lab { color: var(--ink); }
.step.skip { opacity: 0.4; }
.step.skip .mk { border-style: dashed; }
.step.skip .lab { text-decoration: line-through; }
.step.red .mk { border-color: var(--red); background: var(--red); }
.step.red .lab, .step.red .st { color: var(--red); font-weight: 700; }
.step.cur .mk { border-color: var(--sc); border-width: 3px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc) 25%, transparent); }
.step.cur .lab { color: var(--ink); font-weight: 700; }
.step.cur .st { color: var(--sc); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) {
  .step.cur.moving .mk { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--sc) 8%, transparent); } }
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; border: 2px solid var(--lc); }
.empty { color: var(--muted); }
.card { cursor: pointer; }
.card:hover { border-color: var(--cc); }
.card:focus-visible { outline: 2px solid var(--cc); outline-offset: 2px; }
#top { display: grid; gap: 10px; }
#groups { display: grid; gap: 26px; }
body.drill #top, body.drill #groups { display: none; }
body:not(.drill) #detail { display: none; }
#detail, #dmain { display: grid; gap: 18px; }
.back { font: inherit; font-size: 0.88rem; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; justify-self: start; }
.back:hover { color: var(--ink); }
.dhead { display: grid; gap: 6px; }
.dhead h1 { font-family: var(--f-mono); font-size: clamp(1.3rem, 4vw, 1.9rem); overflow-wrap: anywhere; }
.dgrid { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .dgrid { grid-template-columns: 1fr; } }
.col { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h3 { margin: 0; font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.flow svg { width: 100%; height: auto; display: block; }
.flow text { font-family: var(--f-body); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 0.85rem; }
.list li { display: grid; gap: 3px; border-left: 3px solid var(--lc, var(--line)); padding-left: 9px; overflow-wrap: anywhere; }
.list .where { font-family: var(--f-mono); font-size: 0.74rem; color: var(--muted); }
.list .where a { color: var(--muted); }
.list .cmd { display: flex; gap: 6px; align-items: center; }
.list code { font-family: var(--f-mono); font-size: 0.74rem; border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; overflow-wrap: anywhere; }
.none { color: var(--muted); font-size: 0.85rem; margin: 0; }
details.tl > summary { cursor: pointer; font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
details.tl[open] > summary { margin-bottom: 10px; }
.tl svg { width: 100%; max-width: 560px; height: auto; display: block; }
.tl text { font-family: var(--f-body); }
footer { font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header id="top">
    <div class="nav"><span class="eyebrow" id="eyebrow">loading…</span><a href="/map">Map →</a></div>
    <h1>Your PRs</h1>
    <div class="summary" id="summary"></div>
    <div class="legend">
      <span><i style="--lc:var(--you)"></i>you</span>
      <span><i style="--lc:var(--agent)"></i>agent</span>
      <span><i style="--lc:var(--run)"></i>sheepdog</span>
      <span><i style="--lc:var(--wait)"></i>waiting</span>
      <span><i style="--lc:var(--done); background:var(--done)"></i>done</span>
      <span><i style="--lc:var(--line); border-style:dashed"></i>not set up</span>
    </div>
  </header>
  <div id="groups"></div>
  <section id="detail" hidden><div id="dmain"></div><details class="panel tl" id="tl"><summary>Timeline</summary><div id="tlbody"></div></details></section>
  <footer id="foot"></footer>
</div>
<script src="/gh.js"></script>
<script>
const POLL_MS = 30000;
const WHO = { you: "--you", agent: "--agent", run: "--run", wait: "--wait" };
const NAME = { build: "Build", push: "Push", ci: "CI", review: "Review", bot: "Bot review", threads: "Threads", merge: "Merge" };
const GROUPS = [["you", "Needs you"], ["agent", "Agent next"], ["run", "sheepdog next"], ["wait", "Waiting"]];
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const color = who => `var(${WHO[who] || "--wait"})`;
const group = b => (WHO[b.lead.who] ? b.lead.who : "wait");
const $ = id => document.getElementById(id);
const copyBtn = cmd => `<span class="cmd"><code>${esc(cmd)}</code><button class="copy" type="button" data-cmd="${esc(cmd)}">copy</button></span>`;
const prLink = b => b.pr ? `<a href="${esc(b.pr.url)}" target="_blank" rel="noopener">#${esc(b.pr.number)}</a>${b.pr.draft ? " draft" : ""}` : "no PR";
const usd = b => typeof b.usd === "number" ? `<span>$${b.usd.toFixed(2)}</span>` : "";

function card(b) {
  const L = b.lead;
  const rows = b.stages.map(s => {
    const cur = s.status === "cur";
    const moving = cur && s.who !== "you";
    return `<li class="step ${s.status}${moving ? " moving" : ""}" style="--sc:${cur ? color(s.who) : "var(--line)"}">` +
      `<span class="mk"></span><span class="lab">${NAME[s.stage] || esc(s.stage)}</span><span class="st">${esc(s.text)}</span></li>`;
  }).join("");
  return `<article class="card" style="--cc:${color(L.who)}" data-id="${esc(b.id)}" tabindex="0" aria-label="${esc(b.branch)}: open">
    <div><div class="b">${esc(b.branch)}</div><div class="meta"><span>${esc(b.repo)}</span><span>${prLink(b)}</span>${usd(b)}</div></div>
    <div class="now"><span>${esc(L.say)}</span>${L.cmd ? copyBtn(L.cmd) : ""}</div>
    <ol class="steps">${rows}</ol>
  </article>`;
}

function render(f) {
  const bs = f.branches, counts = {};
  bs.forEach(b => (counts[group(b)] = (counts[group(b)] || 0) + 1));
  const repos = [...new Set(bs.map(b => b.repo))].join(", ");
  const eb = $("eyebrow");
  eb.classList.remove("stale");
  eb.textContent = `${bs.length} branch${bs.length === 1 ? "" : "es"}${repos ? " · " + repos : ""}`;
  $("summary").innerHTML = GROUPS.filter(([w]) => counts[w]).map(([w, name]) =>
    `<span class="sum" style="--sc:${color(w)}"><b>${counts[w]}</b>${name.toLowerCase()}</span>`).join("");
  $("groups").innerHTML = bs.length ? GROUPS.map(([w, name]) => {
    const list = bs.filter(b => group(b) === w);
    if (!list.length) return "";
    return `<section class="group"><h2 style="--gc:${color(w)}"><span class="dot"></span>${name}<span class="n">${list.length}</span></h2>` +
      `<div class="cards">${list.map(card).join("")}</div></section>`;
  }).join("") : `<p class="empty">No cached branches yet: enroll one (sd act enroll), and let sd watch make a pass.</p>`;
  $("foot").textContent =
    `sd watch's last pass: ${f.at || "none yet"}. Read at ${new Date().toLocaleTimeString()}, again every ${POLL_MS / 1000}s. The lit stages are each branch's NEXT steps.`;
}

const FLOW = {
  implement: { x: 16, y: 16, w: 170, name: "Implement", sub: "agent builds the task", role: "agent" },
  push: { x: 16, y: 96, w: 170, name: "Commit & push", sub: "sheepdog", role: "run" },
  ci: { x: 16, y: 176, w: 170, name: "CI", sub: "tests on the PR", role: "wait" },
  review: { x: 16, y: 256, w: 170, name: "Local review", sub: "agent reviews", role: "agent" },
  threads: { x: 16, y: 336, w: 170, name: "Bot & threads", sub: "bot review, replies", role: "agent" },
  merge: { x: 16, y: 416, w: 170, name: "Merge", sub: "you", role: "you" },
  cifix: { x: 212, y: 176, w: 128, name: "ci-fix", sub: "when CI is red", role: "agent" },
  fix: { x: 212, y: 256, w: 128, name: "Fix findings", sub: "when review finds", role: "agent" },
};
const NH = 46;
const arrow = (d, c = "var(--muted)") => `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" marker-end="url(#ah)"/>`;

function flowSvg(flow) {
  const N = FLOW;
  let s = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>`;
  for (const [a, b] of [["implement", "push"], ["push", "ci"], ["ci", "review"], ["review", "threads"], ["threads", "merge"]]) s += arrow(`M101,${N[a].y + NH} L101,${N[b].y - 3}`);
  s += arrow(`M186,${N.ci.y + 23} L${N.cifix.x - 3},${N.ci.y + 23}`, "var(--red)");
  s += arrow(`M186,${N.review.y + 23} L${N.fix.x - 3},${N.review.y + 23}`);
  s += arrow(`M276,${N.cifix.y} L276,128 L189,128`);
  s += arrow(`M340,${N.fix.y + 23} L352,${N.fix.y + 23} L352,110 L189,110`);
  for (const [k, n] of Object.entries(N)) {
    const f = flow[k] || {}, lit = !!f.who, c = lit ? color(f.who) : "var(--line)";
    const halo = lit ? `<rect x="${n.x - 4}" y="${n.y - 4}" width="${n.w + 8}" height="${NH + 8}" rx="11" fill="${c}" opacity="0.18"/>` : "";
    const badge = f.count ? `<circle cx="${n.x + n.w - 4}" cy="${n.y + 4}" r="11" fill="${color(n.role)}"/>` +
      `<text x="${n.x + n.w - 4}" y="${n.y + 8}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--surface)" font-family="var(--f-mono)">${f.count}</text>` : "";
    s += `<g><title>${esc(n.name)}${f.count ? `: ${f.count} agent run${f.count > 1 ? "s" : ""}` : ""}${lit ? " (now)" : ""}</title>${halo}` +
      `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${NH}" rx="8" fill="var(--surface)" stroke="${c}" stroke-width="${lit ? 3 : 1.5}"/>` +
      `<rect x="${n.x}" y="${n.y + 8}" width="4" height="${NH - 16}" rx="2" fill="${color(n.role)}"/>` +
      `<text x="${n.x + 14}" y="${n.y + 20}" font-size="14" font-weight="700" fill="var(--ink)">${n.name}</text>` +
      `<text x="${n.x + 14}" y="${n.y + 36}" font-size="10.5" fill="var(--muted)">${n.sub}</text>${badge}</g>`;
  }
  return `<svg viewBox="0 0 360 472" role="img" aria-label="The PR's flow; lit nodes are where it is now">${s}</svg>`;
}

function owedHtml(o) {
  const parts = [];
  if (o.question) parts.push(["The agent asks", [`<li style="--lc:var(--you)"><span>${esc(o.question.text)}</span><span class="where">${esc(o.question.step)} · ${esc(o.question.kind)}${o.question.at_head === false ? " · on an older commit" : ""}</span></li>`]]);
  if (o.failing?.length) parts.push(["Failing checks", o.failing.map(n => `<li style="--lc:var(--red)">${esc(n)}</li>`)]);
  if (o.findings?.length) parts.push(["Review findings", o.findings.map(f =>
    `<li style="--lc:${f.severity === "nit" ? "var(--line)" : "var(--red)"}"><span class="where">${esc(f.severity)} · ${esc(f.file)}${f.line ? ":" + esc(f.line) : ""}</span><span>${esc(f.body)}</span></li>`)]);
  if (o.threads === null) parts.push(["Threads owed a reply", [`<li><span class="none">couldn't read them: GitHub didn't answer at the last pass</span></li>`]]);
  if (o.threads?.length) parts.push(["Threads owed a reply", o.threads.map(t =>
    `<li style="--lc:${t.mark === "!" ? "var(--you)" : "var(--line)"}"><span class="where">${t.mark === "!" ? "blocking" : "info"} · ${esc(t.author)}${t.path ? " · " + esc(t.path) + (t.line ? ":" + esc(t.line) : "") : ""}${t.url ? ` · <a href="${esc(t.url)}" target="_blank" rel="noopener">open</a>` : ""}</span><span>${esc(t.excerpt)}</span></li>`)]);
  if (!parts.length) return `<div class="panel"><h3>What's owed</h3><p class="none">Nothing: no question, failing checks, findings or threads.</p></div>`;
  return parts.map(([h, items]) => `<div class="panel"><h3>${h}</h3><ul class="list">${items.join("")}</ul></div>`).join("");
}

let shown = "";
function renderDetail(b) {
  const key = JSON.stringify(b);
  if (key === shown && $("dmain").innerHTML) return;
  shown = key;
  const next = (b.next || []).map(x => `<li style="--lc:${color(x.who)}"><span>${esc(x.say)}</span>${x.cmd ? copyBtn(x.cmd) : ""}<span class="where">${esc(x.who)} · ${esc(x.key)}</span></li>`).join("");
  $("dmain").innerHTML = `<button class="back" type="button" data-back>← all branches</button>
    <div class="dhead"><div class="eyebrow" id="deyebrow">${esc(b.repo)}</div><h1>${esc(b.branch)}</h1>
      <div class="meta"><span>${prLink(b)}</span>${usd(b)}</div></div>
    <div class="dgrid">
      <div class="col"><div class="panel flow"><h3>Flow</h3>${b.flow ? flowSvg(b.flow) : `<p class="none">${esc(b.lead.say)}</p>`}</div></div>
      <div class="col"><div class="panel"><h3>Next</h3>${next ? `<ul class="list">${next}</ul>` : `<p class="none">${esc(b.lead.say)}</p>`}</div>${b.owed ? owedHtml(b.owed) : ""}</div>
    </div>`;
}

const LANES = [["agent", "Agent", "--agent"], ["run", "sheepdog", "--run"], ["ci", "CI", "--wait"], ["pr", "PR", "--done"]];
const GAP = 20 * 60e3, FOLD = 30, LX = 58, LW = 74;
const ms = t => Date.parse(t);
const span = m => m >= 36e5 ? `${Math.floor(m / 36e5)}h ${Math.round(m % 36e5 / 6e4)}m` : `${Math.round(m / 6e4)}m`;
const ciColor = r => r === "SUCCESS" ? "var(--run)" : /FAIL|ERROR|TIMED|CANCEL|ACTION/.test(r || "") ? "var(--red)" : "var(--wait)";

function tlEvents(t) {
  const ev = (t.agent || []).map(a => {
    const end = ms(a.end), bad = typeof a.status === "number" && a.status !== 0, step = a.step || "agent";
    return { lane: 0, s: end - (a.ms || 0), e: end, label: step, c: bad ? "var(--red)" : "var(--agent)",
      tip: `${step}${bad ? (a.status === 75 ? " (usage limit)" : ` (exit ${a.status})`) : ""} · ${a.ms ? span(a.ms) : "?"}${typeof a.usd === "number" ? ` · $${a.usd.toFixed(2)}` : ""}` };
  });
  const g = t.github;
  if (g) {
    for (const c of g.commits) {
      ev.push({ lane: 1, s: ms(c.at), e: ms(c.at), label: c.sha.slice(0, 7), c: "var(--run)", tip: `commit ${c.sha.slice(0, 7)}: ${c.title}` });
      for (const k of c.ci) {
        // An open check is a point, and an RWX status (no start) spans from its commit only when that's
        // under GAP: committedDate isn't the push, and a bar mustn't bridge a wait that should fold.
        const at = ms(c.at), e = k.end ? ms(k.end) : ms(k.start) || at;
        const s = k.start ? ms(k.start) : e - at <= GAP ? Math.min(at, e) : e;
        ev.push({ lane: 2, s, e, label: "", c: ciColor(k.result), tip: `${k.name}: ${k.result || "running"} on ${c.sha.slice(0, 7)}` });
      }
    }
    if (g.opened) ev.push({ lane: 3, s: ms(g.opened), e: ms(g.opened), label: "opened", c: "var(--done)", tip: "PR opened" });
    if (g.merged) ev.push({ lane: 3, s: ms(g.merged.at), e: ms(g.merged.at), label: "merged", c: "var(--done)", tip: `merged by ${g.merged.by || "?"}` });
  }
  return ev.filter(x => !isNaN(x.s) && !isNaN(x.e));
}

function tlSvg(ev) {
  const iv = ev.map(x => [x.s, x.e]).sort((a, b) => a[0] - b[0]), cl = [];
  for (const [a, b] of iv) {
    const last = cl[cl.length - 1];
    if (last && a - last.e <= GAP) last.e = Math.max(last.e, b); else cl.push({ s: a, e: b });
  }
  const active = cl.reduce((n, c) => n + (c.e - c.s), 0) / 6e4;
  const scale = Math.min(30, Math.max(0.4, 480 / Math.max(active, 1)));
  let y0 = 34;
  for (const c of cl) { c.y = y0; c.h = Math.max(22, (c.e - c.s) / 6e4 * scale); y0 += c.h + FOLD; }
  const y = t => { const c = cl.find(c => t >= c.s && t <= c.e) || cl[0]; return c.y + (t - c.s) / 6e4 * scale; };
  const W = LX + LW * LANES.length;
  let s = LANES.map(([, name, v], i) => `<text x="${LX + i * LW + 8}" y="16" font-size="12" font-weight="700" fill="var(${v})">${name}</text>` +
    `<line x1="${LX + i * LW + 8}" y1="24" x2="${LX + i * LW + 8}" y2="${y0 - FOLD + 4}" stroke="var(--line)"/>`).join("");
  let day = "";
  cl.forEach((c, i) => {
    const d = new Date(c.s), dd = d.toLocaleDateString([], { month: "short", day: "numeric" });
    const hm = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    s += `<text x="0" y="${c.y + 4}" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${hm}</text>` +
      (dd !== day ? `<text x="0" y="${c.y + 16}" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${dd}</text>` : "");
    day = dd;
    const next = cl[i + 1];
    if (next) s += `<rect x="0" y="${c.y + c.h + 6}" width="${W}" height="${FOLD - 12}" rx="4" fill="var(--line)" opacity="0.45"/>` +
      `<text x="${W / 2}" y="${c.y + c.h + FOLD / 2 + 4}" text-anchor="middle" font-size="10.5" fill="var(--muted)">⋯ ${span(next.s - c.e)} ⋯</text>`;
  });
  for (const x of ev) {
    const cx = LX + x.lane * LW + 8, ya = y(x.s), h = y(x.e) - ya;
    const mark = h < 5 ? `<circle cx="${cx}" cy="${ya}" r="5" fill="${x.c}"/>` : `<rect x="${cx - 5}" y="${ya}" width="10" height="${h}" rx="3" fill="${x.c}"/>`;
    s += `<g><title>${esc(x.tip)}</title>${mark}${x.label ? `<text x="${cx + 9}" y="${ya + 4}" font-size="10" fill="var(--ink)">${esc(x.label)}</text>` : ""}</g>`;
  }
  return `<svg viewBox="0 -2 ${W} ${y0 - FOLD + 14}" role="img" aria-label="The branch's timeline: agent steps, commits, CI and the PR, top to bottom">${s}</svg>`;
}

let tlAgain;
async function loadTimeline(id) {
  clearTimeout(tlAgain);
  const body = $("tlbody");
  if (!body.innerHTML) body.innerHTML = `<p class="none">asking GitHub…</p>`;
  try {
    const r = await fetch(`/api/timeline?id=${encodeURIComponent(id)}`, { cache: "no-store" });
    if (openId() !== id) return;
    if (r.status === 404) { body.innerHTML = `<p class="none">${esc(id)} isn't in the watcher's cache any more.</p>`; return; }
    if (!r.ok) throw new Error(r.status);
    const t = await r.json();
    const ev = tlEvents(t);
    const cut = t.github?.total ? `<p class="none">The last ${t.github.commits.length} of ${t.github.total} commits: the earlier ones aren't drawn.</p>` : "";
    const pr = t.github || t.error || t.refreshing || t.fetched;
    const down = t.error ? `<p class="none">GitHub didn't answer${t.github ? ", so its part is the last answer" : ", so this is the agent's steps only"} (${esc(t.error)})</p>` : "";
    const note = cut + down + (pr ? ghLine(t) : `<p class="none">No PR yet: the agent's steps only.</p>`);
    body.innerHTML = note + (ev.length ? tlSvg(ev) : `<p class="none">Nothing recorded for this branch yet.</p>`);
    if (t.refreshing) tlAgain = setTimeout(() => { if ($("tl").open && openId() === id && !document.hidden) loadTimeline(id); }, 1000);
  } catch (e) {
    if (openId() === id) body.innerHTML = `<p class="none">can't reach sd view (${esc(e.message)})</p>`;
  }
}

function openId() {
  const m = location.hash.match(/^#b=(.+)$/);
  try { return m ? decodeURIComponent(m[1]) : null; } catch { return null; }
}

async function loadDetail(id) {
  const back = `<button class="back" type="button" data-back>← all branches</button>`;
  try {
    const r = await fetch(`/api/branch?id=${encodeURIComponent(id)}`, { cache: "no-store" });
    const b = r.ok ? await r.json() : null;
    if (openId() !== id) return;
    if (r.status === 404) {
      shown = "";
      $("dmain").innerHTML = `${back}<p class="none">${esc(id)} isn't in the watcher's cache any more.</p>`;
    } else if (!r.ok) {
      throw new Error(r.status);
    } else {
      renderDetail(b);
    }
  } catch (e) {
    if (openId() !== id) return;
    const eb = $("deyebrow");
    shown = "";
    if (eb) { eb.classList.add("stale"); eb.textContent = `can't reach sd view (${e.message}): showing the last read`; }
    else $("dmain").innerHTML = `${back}<p class="none">can't reach sd view (${esc(e.message)})</p>`;
  }
}

function route() {
  const id = openId();
  document.body.classList.toggle("drill", !!id);
  $("detail").hidden = !id;
  if (id) { $("dmain").innerHTML = ""; shown = ""; $("tl").open = false; $("tlbody").innerHTML = ""; loadDetail(id); window.scrollTo(0, 0); }
}

async function poll(detail) {
  try {
    const r = await fetch("/api/flock", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    const eb = $("eyebrow");
    eb.classList.add("stale");
    eb.textContent = `can't reach sd view (${e.message}): showing the last read`;
  }
  const id = openId();
  if (detail && id) loadDetail(id);
  if (detail && id && $("tl").open && !document.hidden) loadTimeline(id);
}

const openCard = el => { location.hash = "b=" + encodeURIComponent(el.dataset.id); };
document.addEventListener("click", async e => {
  const b = e.target.closest(".copy");
  if (b) {
    try { await navigator.clipboard.writeText(b.dataset.cmd); b.textContent = "copied"; }
    catch {
      const r = document.createRange(); r.selectNodeContents(b.previousElementSibling);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "selected";
    }
    setTimeout(() => (b.textContent = "copy"), 1400);
    return;
  }
  if (e.target.closest("[data-back]")) { location.hash = ""; return; }
  if (e.target.closest("[data-refresh]")) { const id = openId(); refreshGh().then(() => id && loadTimeline(id), () => {}); return; }
  if (e.target.closest("a")) return;
  const c = e.target.closest(".card[data-id]");
  if (c) openCard(c);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && openId()) location.hash = "";
  else if (e.key === "Enter" && e.target.matches?.(".card[data-id]")) openCard(e.target);
});
$("tl").addEventListener("toggle", () => { if ($("tl").open && openId()) loadTimeline(openId()); });
window.addEventListener("hashchange", route);
route();
poll(false);
setInterval(() => poll(true), POLL_MS);
</script>
</body>
