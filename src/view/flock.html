<!doctype html>
<html lang="en" data-pal="fleece" data-face="londrina">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="sd-token" content="__SD_TOKEN__">
<title>sheepdog flock</title>
<link rel="icon" type="image/png" href="/img/sheepdog.png">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
.wrap { max-width: 1200px; gap: 40px; }
.key { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font-size: 0.85rem; align-items: center; }
.key > span { display: inline-flex; gap: 6px; align-items: center; }
.key svg { width: 26px; height: 26px; overflow: visible; }
#top { display: grid; gap: 22px; }
#groups { display: grid; gap: 44px; }
.group { display: grid; gap: 10px; }
.group h2 { margin: 0; display: flex; align-items: baseline; gap: 10px; font-size: 1.15rem; }
.group h2 .n { font-family: var(--f-display); font-weight: var(--w-display); font-size: 2.6rem; line-height: 0.8; color: var(--gc); min-width: 0.6em; }
.flt { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.flt[aria-pressed="true"] { color: var(--ink); font-weight: 700; text-decoration-style: solid; }
.group h2 .flt { display: flex; align-items: baseline; gap: 10px; text-decoration: none; }
.group h2 .flt:hover .nm, .group h2 .flt[aria-pressed="true"] .nm { text-decoration: underline; }
.group.off h2, .group.off h2 .n { color: var(--muted); }
.group h2 .hid { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
#q { font: inherit; font-size: 0.9rem; width: min(100%, 360px); padding: 5px 8px; border: 1px solid var(--line); border-radius: 0; background: var(--surface); color: var(--ink); }
.sheet { display: grid; gap: 2px; }
.cols, .run { display: grid; grid-template-columns: minmax(170px, 1.25fr) minmax(330px, 2.4fr) minmax(190px, 1.6fr); gap: 0 20px; align-items: center; }
.cols { color: var(--muted); font-size: 0.78rem; padding: 0 14px; }
.cols .posts { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
.run { background: var(--surface); padding: 12px 14px; cursor: pointer; }
.run:hover { background: color-mix(in srgb, var(--surface) 88%, var(--ink)); }
.who { min-width: 0; }
.who .b { display: block; text-decoration: none; font-family: var(--f-mono); font-weight: 600; font-size: 0.92rem; overflow-wrap: anywhere; }
.who .b:hover { text-decoration: underline; }
.meta { color: var(--muted); font-size: 0.8rem; display: flex; gap: 4px 10px; flex-wrap: wrap; }
.meta a { color: var(--muted); }
.fence { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); height: 44px; }
.fence::before { content: ""; position: absolute; left: calc(100% / 14); right: calc(100% / 14); top: 50%; border-top: 2px dashed var(--line); }
.fence::after { content: ""; position: absolute; left: calc(100% / 14); top: 50%; width: calc((100% / 7) * var(--reach)); border-top: 2px solid var(--done); }
.fence .p { position: relative; z-index: 1; display: grid; place-items: center; }
.fence svg { width: 34px; height: 34px; overflow: visible; }
.fence .p .t { position: absolute; top: 100%; margin-top: -6px; font-size: 0.7rem; white-space: nowrap; color: var(--pc); font-weight: 700; max-width: 11em; overflow: hidden; text-overflow: ellipsis; }
.next { display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.next .say { font-weight: 700; color: var(--gc); }
.next .age { font-family: var(--f-display); font-weight: var(--w-display); font-size: 1.15rem; line-height: 1; color: var(--muted); margin-left: 10px; }
.cmd { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.cmd code { font-size: 0.8rem; overflow-wrap: anywhere; }
.empty { color: var(--muted); }
body.drill #top > :not(.mast), body.drill .mast > :is(.dog, h1, .sub), body.drill #groups { display: none; }
body.drill .brand { grid-column: 1 / 3; }
body:not(.drill) #detail { display: none; }
#detail, #dmain { display: grid; gap: 26px; }
.back { font: inherit; font-size: 0.9rem; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; justify-self: start; text-decoration: underline; text-underline-offset: 3px; }
.back:hover { color: var(--ink); }
.dhead { display: grid; gap: 8px; }
.dhead h1 { font-size: clamp(2rem, 6vw, 3.2rem); }
.dgrid { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 760px) { .dgrid { grid-template-columns: 1fr; } }
.col { display: grid; gap: 28px; min-width: 0; }
.part { border-top: 2px solid var(--ink); padding-top: 10px; display: grid; gap: 10px; min-width: 0; }
.flow svg { width: 100%; height: auto; display: block; }
.flow text { font-family: var(--f-body); }
.list { list-style: none; margin: 0; padding: 0; display: grid; font-size: 0.88rem; }
.list li { display: grid; gap: 3px; padding: 8px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.list li:last-child { border-bottom: 0; }
.list .lead { font-weight: 700; color: var(--lc, var(--ink)); }
.list .where { font-family: var(--f-mono); font-size: 0.76rem; color: var(--muted); }
.list .where a { color: var(--muted); }
.list .where.c { color: var(--lc, var(--muted)); font-weight: 600; }
.dhead .fence { max-width: 620px; margin-top: 8px; }
.actline { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); margin: 4px 0 0; }
.act { font: inherit; font-size: 0.9rem; font-weight: 700; color: var(--surface); background: var(--agent); border: 0; border-radius: 0; padding: 6px 14px; cursor: pointer; }
.act:hover { background: color-mix(in srgb, var(--agent) 82%, var(--ink)); }
.act:disabled { opacity: 0.6; cursor: default; }
.set { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.85rem; }
.set li { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; min-width: 0; }
.set .k { font-family: var(--f-mono); font-size: 0.82rem; white-space: nowrap; }
.set .v { color: var(--muted); font-family: var(--f-mono); font-size: 0.8rem; text-align: right; overflow-wrap: anywhere; }
.set li.long .v { grid-row: 2; grid-column: 1 / -1; text-align: left; }
.set .v:empty::before { content: "unset"; font-style: italic; }
.set .layer { grid-column: 3; font-size: 0.76rem; color: var(--muted); font-style: italic; white-space: nowrap; }
.set li[tabindex] { cursor: pointer; }
.set li[tabindex]:hover .k { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
.set .how { grid-column: 1 / -1; display: none; }
.set li:focus-within .how { display: flex; }
.set .how code { font-size: 0.74rem; color: var(--muted); }
.set .layer.branch { color: var(--ink); font-weight: 700; font-style: normal; }
.set .edit { display: flex; gap: 8px; align-items: center; justify-self: end; }
.set input[type=number] { font: inherit; font-family: var(--f-mono); font-size: 0.82rem; width: 5.5em; padding: 2px 5px; border: 1px solid var(--line); border-radius: 0; background: var(--bg); color: var(--ink); }
.set input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--agent); cursor: pointer; }
.setbtn { font: inherit; font-size: 0.8rem; color: var(--muted); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
details.more > summary { cursor: pointer; font-size: 0.82rem; color: var(--muted); }
details.more[open] > summary { margin-bottom: 8px; }
.setsay { min-height: 1.2em; }
.setsay.bad { color: var(--red); }
details.tl > summary { cursor: pointer; font-weight: 700; }
details.tl[open] > summary { margin-bottom: 10px; }
.tl svg { width: 100%; max-width: 560px; height: auto; display: block; }
.tl text { font-family: var(--f-body); }
.tl svg g { cursor: help; }
.tl a g { cursor: pointer; }
.tl a text { text-decoration: underline; }
.cost { border-collapse: collapse; font-size: 0.85rem; margin-top: 18px; font-variant-numeric: tabular-nums; }
.cost caption { text-align: left; font-weight: 700; padding-bottom: 6px; }
.cost td { padding: 3px 16px 3px 0; color: var(--muted); text-align: right; white-space: nowrap; }
.cost td:first-child { color: var(--ink); text-align: left; }
.cost td:last-child { width: 120px; padding-right: 0; }
.cost .bar { display: block; height: 6px; background: var(--agent); }
.cost tr.all td { border-top: 1px solid var(--line); color: var(--ink); font-weight: 700; padding-top: 6px; }
@media (max-width: 820px) {
  .cols { display: none; }
  .run { grid-template-columns: 1fr; gap: 10px; }
  .fence { height: 56px; margin-bottom: 12px; }
  .fence .p::before { content: attr(data-s); position: absolute; top: -4px; font-size: 0.66rem; color: var(--muted); }
}
</style>
</head>
<body>
<div class="wrap">
  <header id="top">
    <div class="mast">
      <a class="dog" href="https://github.com/chrismo/sheepdog" target="_blank" rel="noopener" tabindex="-1"><img src="/img/sheepdog.png" alt="" width="92" height="92"></a>
      <a class="brand" href="https://github.com/chrismo/sheepdog" target="_blank" rel="noopener">sheepdog</a>
      <h1>The flock</h1>
      <div class="sub" id="sub">Loading the flock</div>
      <nav class="pages"><a href="/" aria-current="page">Flock</a><a href="/atlas">Atlas</a><a href="/map">Map</a></nav>
      <div id="look"></div>
    </div>
    <input id="q" type="search" placeholder="type / to filter by branch, repo or PR" autocomplete="off" spellcheck="false" aria-label="filter the flock">
    <div id="fresh"></div>
    <div class="key" id="key"></div>
  </header>
  <div id="groups"></div>
  <section id="detail" hidden><div id="dmain"></div><details class="part tl" id="tl"><summary>Timeline</summary><div id="tlbody"></div></details></section>
  <footer id="foot"></footer>
</div>
<script src="/gh.js"></script>
<script>
const POLL_MS = 30000;
const WHO = { you: "--you", agent: "--agent", run: "--run", wait: "--wait" };
const STAGES = [["build", "Build"], ["push", "Push"], ["ci", "CI"], ["review", "Review"], ["bot", "Bot"], ["threads", "Threads"], ["merge", "Merge"]];
const GROUPS = [["you", "need you"], ["agent", "the agent moves next"], ["run", "sheepdog moves next"], ["wait", "waiting"]];
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const color = who => `var(${WHO[who] || "--wait"})`;
const group = b => (WHO[b.lead.who] ? b.lead.who : "wait");
const $ = id => document.getElementById(id);
const copyBtn = cmd => `<span class="cmd"><code>${esc(cmd)}</code><button class="copy" type="button" data-cmd="${esc(cmd)}">copy</button></span>`;
const prLink = b => b.pr ? `<a href="${esc(b.pr.url)}" target="_blank" rel="noopener">#${esc(b.pr.number)}</a>${b.pr.draft ? "<span>draft</span>" : ""}` : "<span>no PR</span>";
const usd = b => typeof b.usd === "number" ? `<span>$${b.usd.toFixed(2)}</span>` : "";
const checked = b => b.checked ? `<span>checked ${ago(b.checked)} ago</span>` : "";

function rng(str) {
  let h = 2166136261;
  for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296;
}
// Seeded by the branch and stage, so a mark keeps its shape from one poll to the next.
function splotch(seed, fill) {
  const r = rng(seed), n = 12, pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + r() * 0.3, d = 11 * (0.72 + r() * 0.5);
    pts.push([17 + Math.cos(a) * d * 1.15, 17 + Math.sin(a) * d * 0.9]);
  }
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  let d = `M${mid(pts[n - 1], pts[0]).join(",")}`;
  for (let i = 0; i < n; i++) d += ` Q${pts[i].join(",")} ${mid(pts[i], pts[(i + 1) % n]).join(",")}`;
  const drips = [0, 1].map(() => {
    const a = r() * Math.PI * 2, dd = 15 + r() * 4;
    return `<circle cx="${17 + Math.cos(a) * dd}" cy="${17 + Math.sin(a) * dd * 0.8}" r="${0.9 + r() * 1.3}" fill="${fill}"/>`;
  }).join("");
  return `<svg viewBox="0 0 34 34" aria-hidden="true"><path d="${d}Z" fill="${fill}"/>${drips}</svg>`;
}
const POST = `<line x1="17" y1="8" x2="17" y2="26" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>`;
const MARK = {
  todo: () => `<svg viewBox="0 0 34 34" aria-hidden="true">${POST}</svg>`,
  done: () => `<svg viewBox="0 0 34 34" aria-hidden="true">${POST}<path d="M9,25 Q16,17 26,8" fill="none" stroke="var(--done)" stroke-width="3.2" stroke-linecap="round"/></svg>`,
  red: () => `<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M9,9 Q17,16 25,26 M25,8 Q16,17 9,26" fill="none" stroke="var(--red)" stroke-width="3.6" stroke-linecap="round"/></svg>`,
  skip: () => "",
};

const SAID = { cur: "now", done: "done", todo: "to do", red: "failing", skip: "not set up" };
function fence(b) {
  if (!b.stages?.length) return "<div></div>";
  const at = k => b.stages.find(x => x.stage === k) || { status: "todo" };
  const said = k => SAID[at(k).status] || at(k).status;
  let reach = 0;
  STAGES.forEach(([k], i) => { if (["done", "red", "cur"].includes(at(k).status)) reach = i; });
  // One label under the fence: a post's column is too narrow for two side by side.
  const first = st => STAGES.find(([k]) => at(k).status === st && at(k).text);
  const labelled = (first("cur") || first("red") || [])[0];
  const posts = STAGES.map(([k, label]) => {
    const s = at(k), title = `${label}: ${said(k)}${s.text ? ", " + s.text : ""}`;
    const t = k === labelled && s.text ? `<span class="t">${esc(s.text)}</span>` : "";
    if (s.status === "cur") {
      const c = color(s.who);
      return `<span class="p" data-s="${label}" title="${esc(title)}" style="--pc:${c}">${splotch(b.id + k, c)}${t}</span>`;
    }
    const name = s.status === "skip" ? "" : ` data-s="${label}"`;
    return `<span class="p"${name} title="${esc(title)}" style="--pc:var(--red)">${(MARK[s.status] || MARK.todo)()}${t}</span>`;
  }).join("");
  const heard = STAGES.map(([k, label]) => `${label} ${said(k)}`).join(", ");
  return `<div class="fence" style="--reach:${reach}" role="img" aria-label="${esc(heard)}">${posts}</div>`;
}

const sat = iso => {
  const m = Math.max(0, Date.now() - Date.parse(iso));
  return m >= 864e5 ? `${Math.floor(m / 864e5)}d` : m >= 36e5 ? `${Math.floor(m / 36e5)}h` : `${Math.max(1, Math.floor(m / 6e4))}m`;
};
const inStep = b => b.since ? `<span class="age" title="${esc(`in this step since about ${new Date(b.since).toLocaleString()}`)}">${sat(b.since)}</span>` : "";

function row(b) {
  const L = b.lead;
  return `<article class="run" style="--gc:${color(L.who)}" data-id="${esc(b.id)}" tabindex="0" aria-label="${esc(b.branch)}: open">
    <div class="who"><a class="b" href="#b=${encodeURIComponent(b.id)}">${esc(b.branch)}</a><div class="meta"><span>${esc(b.repo)}</span>${prLink(b)}${usd(b)}${checked(b)}</div></div>
    ${fence(b)}
    <div class="next"><span class="say">${esc(L.say)}${inStep(b)}</span>${L.cmd ? copyBtn(L.cmd) : ""}</div>
  </article>`;
}

const MOVERS = [["you", "you"], ["agent", "the agent"], ["run", "sheepdog"], ["wait", "no one: waiting"]];
const KEY = `<span>${MARK.todo()}to do</span><span>${MARK.done()}done</span><span>${MARK.red()}failing</span><span>no post: not set up</span>` +
  `<span>${splotch("key", "var(--muted)")}<span>where it stands, painted for who moves next: ` +
  MOVERS.map(([w, name]) => `<b style="color:${color(w)}">${name}</b>`).join(", ") + `</span></span>`;

// The list's hash holds the filter (#who=you&repo=kinsite&q=fact); a drill-in's #b= leaves F as it was.
let F = { who: "", repo: "", q: "" }, last = null;
function fuzzy(q, s) {
  s = s.toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => {
    let i = 0;
    for (const c of s) if (c === t[i]) i++;
    return i === t.length;
  });
}
const shownBy = b => (!F.repo || b.repo === F.repo) && fuzzy(F.q, `${b.branch} ${b.repo} ${b.pr ? "#" + b.pr.number : ""}`);
function filterHash() {
  return new URLSearchParams(Object.entries(F).filter(([, v]) => v)).toString();
}
function readFilter() {
  const p = new URLSearchParams(location.hash.slice(1));
  F = { who: p.get("who") || "", repo: p.get("repo") || "", q: p.get("q") || "" };
  $("q").value = F.q;
}
function setFilter(patch) {
  F = { ...F, ...patch };
  const h = filterHash();
  history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
  if (last) render(last);
}

function repoLine(bs) {
  const repos = [...new Set([...bs.map(b => b.repo), F.repo].filter(Boolean))];
  const btn = r => `<button class="flt" type="button" data-repo="${esc(r)}" aria-pressed="${F.repo === r}">${esc(r)}</button>`;
  const named = repos.length > 1 ? `${repos.slice(0, -1).map(btn).join(", ")} and ${btn(repos.at(-1))}` : btn(repos[0]);
  return `${bs.length} branch${bs.length === 1 ? "" : "es"} in ${named}.`;
}

function groupHtml([w, name], bs, head) {
  const all = bs.filter(b => group(b) === w);
  if (!all.length && F.who !== w) return "";
  const off = F.who && F.who !== w, list = off ? [] : all.filter(shownBy), hid = all.length - list.length;
  return `<section class="group${off ? " off" : ""}" style="--gc:${color(w)}"><h2><button class="flt" type="button" data-who="${w}" aria-pressed="${F.who === w}"><span class="n">${all.length}</span><span class="nm">${name}</span></button>` +
    `${hid && !off ? `<span class="hid">${hid} hidden</span>` : ""}</h2>${list.length ? `<div class="sheet">${head}${list.map(row).join("")}</div>` : ""}</section>`;
}

function keepFocus(draw) {
  const a = document.activeElement, r = a?.closest(".run[data-id]");
  const inRow = r && r !== a ? [...r.querySelectorAll("a, button")].indexOf(a) : -1;
  const sel = r ? `.run[data-id="${CSS.escape(r.dataset.id)}"]`
    : a?.dataset?.who ? `[data-who="${a.dataset.who}"]` : a?.dataset?.repo ? `[data-repo="${CSS.escape(a.dataset.repo)}"]` : "";
  draw();
  const el = sel ? document.querySelector(sel) : null;
  (inRow >= 0 ? el?.querySelectorAll("a, button")[inRow] : el)?.focus({ preventScroll: true });
}

function render(f) {
  last = f;
  const bs = f.branches;
  const sub = $("sub");
  sub.classList.remove("stale");
  $("key").innerHTML = bs.length ? KEY : "";
  const head = `<div class="cols" aria-hidden="true"><span>Branch</span><span class="posts">${STAGES.map(s => `<span>${s[1]}</span>`).join("")}</span><span>Next move</span></div>`;
  keepFocus(() => {
    sub.innerHTML = bs.length ? repoLine(bs) : "No branches yet.";
    $("groups").innerHTML = bs.length ? GROUPS.map(g => groupHtml(g, bs, head)).join("")
      : `<p class="empty">No cached branches yet: enroll one (sd act enroll), and let sd watch make a pass.</p>`;
  });
  $("fresh").innerHTML = bs.length ? `<p class="none ghline">${f.held ? esc(f.held) : f.refreshing ? "Checking a branch now." : "A branch is checked again once it's a minute old."} ${refreshBtn()}</p>` : "";
  $("foot").textContent = `sd watch's last pass: ${f.at || "none yet"}. The paint marks are each branch's NEXT steps.`;
}

const NH = 46;
const sy = i => 16 + i * 64;
const LOOPS = [["cifix", "ci", "ci-fix", "when CI is red", "ci-red"], ["fix", "review", "Fix findings", "when review finds", "review-fix"]];
const arrow = (d, c = "var(--muted)") => `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" marker-end="url(#ah)"/>`;
const placed = (svg, x, y) => svg.replace("<svg ", `<svg x="${x}" y="${y}" width="30" height="30" `);

function flowNode(k, x, y, w, name, sub, f, st, href) {
  const lit = !!f.who, c = lit ? color(f.who) : st === "red" ? "var(--red)" : st === "done" ? "var(--done)" : "var(--line)";
  const mark = lit ? placed(splotch(k, c), x + w - 30, y - 10) : st === "done" ? placed(MARK.done(), x + w - 30, y + 8) : st === "red" ? placed(MARK.red(), x + w - 30, y + 8) : "";
  const runs = f.count ? `<text x="${x + w - (mark ? 32 : 8)}" y="${y + 20}" text-anchor="end" font-size="12" font-weight="700" fill="var(--agent)">×${f.count}</text>` : "";
  const skip = st === "skip";
  const said = lit ? "now" : SAID[st];
  const title = `${name}: ${[said, sub !== said && sub, f.count && `${f.count} agent run${f.count > 1 ? "s" : ""}`].filter(Boolean).join(", ")}`;
  return `<a href="${href}"><g><title>${esc(title)}</title>` +
    `<rect x="${x}" y="${y}" width="${w}" height="${NH}" fill="var(--surface)" stroke="${c}" stroke-width="${lit ? 3 : 1.5}"${skip ? ` stroke-dasharray="4 4"` : ""}/>` +
    `<text x="${x + 10}" y="${y + 20}" font-size="14" font-weight="700" fill="var(${skip ? "--muted" : "--ink"})">${esc(name)}</text>` +
    `<text x="${x + 10}" y="${y + 36}" font-size="10.5" fill="var(--muted)">${esc(sub)}</text>${runs}${mark}</g></a>`;
}

function flowSvg(flow, stages) {
  const at = k => stages.find(x => x.stage === k) || { status: "todo" };
  const row = k => STAGES.findIndex(([s]) => s === k);
  const push = sy(row("push")), ci = sy(row("ci")), rv = sy(row("review"));
  let s = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>`;
  for (let i = 0; i + 1 < STAGES.length; i++) s += arrow(`M101,${sy(i) + NH} L101,${sy(i + 1) - 3}`);
  s += arrow(`M186,${ci + 23} L209,${ci + 23}`, "var(--red)");
  s += arrow(`M186,${rv + 23} L209,${rv + 23}`);
  s += arrow(`M276,${ci} L276,${push + 32} L189,${push + 32}`);
  s += arrow(`M340,${rv + 23} L352,${rv + 23} L352,${push + 18} L189,${push + 18}`);
  STAGES.forEach(([k, label], i) => {
    const st = at(k), sub = st.text || (st.status === "skip" ? "not set up" : "");
    // A fix key lights its loop in flow but the stage on the fence: paint both.
    const f = { ...flow[k], who: flow[k]?.who || st.who };
    s += flowNode(k, 16, sy(i), 170, label, sub, f, st.status, `/atlas#s=${encodeURIComponent(k)}`);
  });
  for (const [k, from, name, sub, key] of LOOPS) s += flowNode(k, 212, sy(row(from)), 128, name, sub, flow[k] || {}, "", `/atlas#k=${encodeURIComponent(key)}`);
  const h = sy(STAGES.length - 1) + NH + 16;
  return `<svg viewBox="0 0 360 ${h}" role="img" aria-label="The PR's flow: the seven stages and the two fix loops; a painted node is where it is now">${s}</svg>`;
}

function owedHtml(o) {
  const parts = [];
  if (o.question) parts.push(["The agent asks", [`<li style="--lc:var(--you)"><span class="lead">${esc(o.question.text)}</span><span class="where">${esc(o.question.step)}, ${esc(o.question.kind)}${o.question.at_head === false ? ", on an older commit" : ""}</span></li>`]]);
  if (o.failing?.length) parts.push(["Failing checks", o.failing.map(n => `<li style="--lc:var(--red)"><span class="lead">${esc(n)}</span></li>`)]);
  if (o.findings?.length) parts.push(["Review findings", o.findings.map(f =>
    `<li style="--lc:${f.severity === "nit" ? "var(--muted)" : "var(--red)"}"><span class="where c">${esc(f.severity)}, ${esc(f.file)}${f.line ? ":" + esc(f.line) : ""}</span><span>${esc(f.body)}</span></li>`)]);
  if (o.threads === null) parts.push(["Threads owed a reply", [`<li><span class="none">couldn't read them: GitHub didn't answer at the last pass</span></li>`]]);
  if (o.threads?.length) parts.push(["Threads owed a reply", o.threads.map(t =>
    `<li style="--lc:${t.mark === "!" ? "var(--you)" : "var(--muted)"}"><span class="where c">${t.mark === "!" ? "blocking" : "info"}, ${esc(t.author)}${t.path ? ", " + esc(t.path) + (t.line ? ":" + esc(t.line) : "") : ""}${t.url ? `, <a href="${esc(t.url)}" target="_blank" rel="noopener">open</a>` : ""}</span><span>${esc(t.excerpt)}</span></li>`)]);
  if (!parts.length) return `<div class="part"><h3>What's owed</h3><p class="none">Nothing: no question, failing checks, findings or threads.</p></div>`;
  return parts.map(([h, items]) => `<div class="part"><h3>${h}</h3><ul class="list">${items.join("")}</ul></div>`).join("");
}

// Settings (#396): the server lists each settings.* key with its layer and
// which the page may set; sd config checks the value, so the page only sends it.
const NUM_STEP = { "settings.reviewRounds": "1", "settings.stepBudget": "any" };
const showVal = v => v === null || v === undefined ? "" : Array.isArray(v) ? v.map(x => typeof x === "string" ? x : JSON.stringify(x)).join(", ") : typeof v === "object" ? JSON.stringify(v) : String(v);
function settingRow(k) {
  const name = k.path.replace(/^settings\./, "");
  const layer = `<span class="layer ${k.source === "branch" ? "branch" : ""}" title="the layer this value comes from">${esc(k.source)}</span>`;
  let v;
  if (!k.editable) v = `<span class="v">${esc(showVal(k.value))}</span>`;
  else if (typeof k.value === "boolean") v = `<span class="edit"><input type="checkbox" data-set="${esc(k.path)}" aria-label="${esc(name)}"${k.value ? " checked" : ""}></span>`;
  else v = `<span class="edit"><input type="number" min="0" step="${NUM_STEP[k.path] || "any"}" value="${esc(k.value)}" data-path="${esc(k.path)}" aria-label="${esc(name)}"><button class="setbtn" type="button" data-set="${esc(k.path)}">set</button></span>`;
  // A value that won't fit beside its name in the 400px column goes under it.
  const long = name.length + showVal(k.value).length + k.source.length > 44 ? ` class="long"` : "";
  const focus = k.set ? ` tabindex="0" data-setting="${esc(k.path)}" title="click for the sd config command that changes it"` : "";
  const how = k.set ? `<span class="how">${copyBtn(k.set)}</span>` : "";
  return `<li${long}${focus}><span class="k">${esc(name)}</span>${v}${layer}${how}</li>`;
}
// A row's command shows while it has focus, which a redraw would drop.
const openSetting = () => document.activeElement?.closest?.("#dmain [data-setting]")?.dataset.setting;
function reopenSetting(path) {
  if (path) document.querySelector(`#dmain [data-setting="${CSS.escape(path)}"]`)?.focus({ preventScroll: true });
}
// The last set's word and whether "all settings" is open, per branch: the
// drill-in is redrawn whole, so both are drawn from here, not left in the old DOM.
let setNote = { id: "", text: "", bad: false }, moreOpen = { id: "", open: false };
function settingsHtml(b) {
  if (!b.settings) return `<div class="part"><h3>Settings</h3><p class="none">Not read: the branch's repo isn't registered with sd watch, or sd config couldn't explain it.</p></div>`;
  const edit = b.settings.filter(k => k.editable), rest = b.settings.filter(k => !k.editable);
  const note = setNote.id === b.id ? setNote : { text: "", bad: false };
  const open = moreOpen.id === b.id && moreOpen.open;
  return `<div class="part"><h3>Settings</h3>
    <ul class="set">${edit.map(settingRow).join("")}</ul><p class="none setsay${note.bad ? " bad" : ""}">${esc(note.text)}</p>
    <details class="more"${open ? " open" : ""}><summary>all ${b.settings.length} settings</summary><ul class="set">${rest.map(settingRow).join("")}</ul></details></div>`;
}

function sayNote(id, text, bad) {
  setNote = { id, text, bad };
  const say = document.querySelector(".setsay");
  if (!say) return;
  say.textContent = text;
  say.classList.toggle("bad", bad);
}

async function setConfig(path, value) {
  const id = openId();
  if (!id) return;
  sayNote(id, `setting ${path.replace(/^settings\./, "")}…`, false);
  let r, text;
  try {
    r = await fetch("/api/config", { method: "POST", headers: { "X-Sd-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({ id, path, value }) });
    text = (await r.text()).trim();
  } catch (e) {
    text = "can't reach sd view";
  }
  if (openId() !== id) return;
  sayNote(id, r?.ok ? text : r?.status === 403 ? "refused: reload the page" : text, !r?.ok);
  // Redraw either way: a set shows its new value, a refused one puts the control back.
  shown = "";
  poll(true);
}

// The server says which step gets a button (act: {key, verb}) and whether it's running (acting).
function actLine(b) {
  if (b.acting) return `<p class="actline"><button class="act" type="button" disabled>running…</button><span>sd act ${esc(b.act?.verb || b.acting)}, as the watcher would run it</span></p>`;
  if (!b.act) return "";
  return `<p class="actline"><button class="act" type="button" data-act="${esc(b.act.key)}">run sd act ${esc(b.act.verb)}</button><span>the same sd act the watcher runs</span></p>`;
}

async function runStep(btn) {
  const id = openId(), say = btn.nextElementSibling, label = btn.textContent;
  if (!id) return;
  btn.disabled = true;
  btn.textContent = "starting…";
  // A refusal other than a stale token's leaves the button usable: the drill-in
  // isn't redrawn till its JSON changes, and a 409's cause can pass.
  const refused = why => { btn.disabled = false; btn.textContent = label; say.textContent = why; };
  let r;
  try {
    r = await fetch("/api/act", { method: "POST", headers: { "X-Sd-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({ id, key: btn.dataset.act }) });
  } catch (e) {
    refused("can't reach sd view");
    return;
  }
  const text = (await r.text()).trim();
  if (r.status === 403) {
    btn.textContent = "refused: reload the page";
    say.textContent = text;
    return;
  }
  if (!r.ok) {
    refused(`not run: ${text}`);
    return;
  }
  shown = "";
  poll(true);
}

let shown = "", shownId = "";
function renderDetail(b) {
  const key = JSON.stringify(b);
  if (key === shown && $("dmain").innerHTML) return;
  // A redraw under a value being typed would lose it: the next poll draws it.
  if (document.activeElement?.matches("#dmain input[type=number]")) return;
  shown = key;
  const more = document.querySelector("#dmain details.more");
  if (more) moreOpen = { id: shownId, open: more.open };
  if (moreOpen.id !== b.id) moreOpen = { id: b.id, open: false };
  const open = shownId === b.id ? openSetting() : null;
  shownId = b.id;
  const next = (b.next || []).map(x => `<li style="--lc:${color(x.who)}"><span class="lead">${esc(x.say)}</span>${x.cmd ? copyBtn(x.cmd) : ""}<span class="where">${esc(x.who)}, <a href="/atlas#k=${encodeURIComponent(x.key)}" title="this step in the Atlas">${esc(x.key)}</a></span></li>`).join("");
  $("dmain").innerHTML = `<button class="back" type="button" data-back>Back to the flock</button>
    <div class="dhead"><h1>${esc(b.branch)}</h1><div class="sub" id="dsub">${esc(b.repo)}</div>
      <div class="meta">${prLink(b)}${usd(b)}${checked(b)}</div>${fence(b)}</div>
    <div class="dgrid">
      <div class="col"><div class="part flow"><h3>Flow</h3>${b.flow ? flowSvg(b.flow, b.stages) : `<p class="none">${esc(b.lead.say)}</p>`}</div>${settingsHtml(b)}</div>
      <div class="col"><div class="part"><h3>Next</h3>${next ? `<ul class="list">${next}</ul>` : `<p class="none">${esc(b.lead.say)}</p>`}${actLine(b)}</div>${b.owed ? owedHtml(b.owed) : ""}</div>
    </div>`;
  reopenSetting(open);
}

const LANES = [["agent", "Agent", "--agent"], ["run", "sheepdog", "--run"], ["ci", "CI", "--wait"], ["pr", "PR", "--done"]];
const GAP = 20 * 60e3, FOLD = 30, LX = 58, LW = 74;
const ms = t => Date.parse(t);
const span = m => m < 6e4 ? `${Math.floor(m / 1e3)}s` : m >= 864e5 ? `${Math.floor(m / 864e5)}d ${Math.floor(m % 864e5 / 36e5)}h` : m >= 36e5 ? `${Math.floor(m / 36e5)}h ${Math.round(m % 36e5 / 6e4)}m` : `${Math.round(m / 6e4)}m`;
const ciColor = r => r === "SUCCESS" ? "var(--run)" : /FAIL|ERROR|TIMED|CANCEL|ACTION/.test(r || "") ? "var(--red)" : "var(--wait)";

function tlEvents(t) {
  const ev = (t.agent || []).map(a => {
    const end = ms(a.end), bad = typeof a.status === "number" && a.status !== 0, step = a.step || "agent";
    return { lane: 0, s: end - (a.ms || 0), e: end, label: step, c: bad ? "var(--red)" : "var(--agent)",
      tip: `${step}${bad ? (a.status === 75 ? " (usage limit)" : ` (exit ${a.status})`) : ""}, ${a.ms ? span(a.ms) : "?"}${typeof a.usd === "number" ? `, $${a.usd.toFixed(2)}` : ""}` };
  });
  const g = t.github, repo = t.pr?.replace(/\/pull\/\d+$/, "");
  if (g) {
    for (const c of g.commits) {
      ev.push({ lane: 1, s: ms(c.at), e: ms(c.at), label: c.sha.slice(0, 7), c: "var(--run)", tip: `commit ${c.sha.slice(0, 7)}: ${c.title}`,
        href: repo && `${repo}/commit/${c.sha}` });
      for (const k of c.ci) {
        // An open check is a point, and a commit status (no start) spans from its commit only when that's
        // under GAP: committedDate isn't the push, and a bar mustn't bridge a wait that should fold.
        const at = ms(c.at), e = k.end ? ms(k.end) : ms(k.start) || at;
        const s = k.start ? ms(k.start) : e - at <= GAP ? Math.min(at, e) : e;
        ev.push({ lane: 2, s, e, label: "", c: ciColor(k.result), tip: `${k.name}: ${k.result || "running"} on ${c.sha.slice(0, 7)}` });
      }
    }
    if (g.opened) ev.push({ lane: 3, s: ms(g.opened), e: ms(g.opened), label: "opened", c: "var(--done)", tip: "PR opened", href: t.pr });
    if (g.merged) ev.push({ lane: 3, s: ms(g.merged.at), e: ms(g.merged.at), label: "merged", c: "var(--done)", tip: `merged by ${g.merged.by || "?"}`, href: t.pr });
  }
  return ev.filter(x => !isNaN(x.s) && !isNaN(x.e));
}

const tlTime = (t, y) => `<text x="0" y="${y + 4}" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</text>`;

function tlSvg(ev, now) {
  const iv = [...ev.map(x => [x.s, x.e]), [now, now]].sort((a, b) => a[0] - b[0]), cl = [];
  for (const [a, b] of iv) {
    const last = cl[cl.length - 1];
    if (last && a - last.e <= GAP) last.e = Math.max(last.e, b); else cl.push({ s: a, e: b });
  }
  const active = cl.reduce((n, c) => n + (c.e - c.s), 0) / 6e4;
  const scale = Math.min(30, Math.max(0.4, 480 / Math.max(active, 1)));
  let y0 = 34;
  for (const c of cl) { c.y = y0; c.h = Math.max(22, (c.e - c.s) / 6e4 * scale); y0 += c.h + FOLD; }
  const y = t => { const c = cl.find(c => t >= c.s && t <= c.e) || cl[0]; return c.y + (t - c.s) / 6e4 * scale; };
  const W = LX + LW * LANES.length;
  let s = LANES.map(([, name, v], i) => `<text x="${LX + i * LW + 8}" y="16" font-size="12" font-weight="700" fill="var(${v})">${name}</text>` +
    `<line x1="${LX + i * LW + 8}" y1="24" x2="${LX + i * LW + 8}" y2="${y0 - FOLD + 4}" stroke="var(--line)"/>`).join("");
  let day = "";
  cl.forEach((c, i) => {
    const d = new Date(c.s), dd = d.toLocaleDateString([], { month: "short", day: "numeric" });
    if (c.s < now) s += tlTime(c.s, c.y) +
      (dd !== day ? `<text x="0" y="${c.y + 16}" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${dd}</text>` : "");
    day = dd;
    if (c.h >= 60 && c.e < now) s += tlTime(c.e, c.y + c.h);
    const next = cl[i + 1];
    if (next) s += `<rect x="0" y="${c.y + c.h + 6}" width="${W}" height="${FOLD - 12}" rx="4" fill="var(--line)" opacity="0.45"/>` +
      `<text x="${W / 2}" y="${c.y + c.h + FOLD / 2 + 4}" text-anchor="middle" font-size="10.5" fill="var(--muted)">⋯ ${span(next.s - c.e)} ⋯</text>`;
  });
  for (const x of ev) {
    const cx = LX + x.lane * LW + 8, ya = y(x.s), h = y(x.e) - ya;
    const mark = h < 5 ? `<circle cx="${cx}" cy="${ya}" r="5" fill="${x.c}"/>` : `<rect x="${cx - 5}" y="${ya}" width="10" height="${h}" rx="3" fill="${x.c}"/>`;
    const g = `<g><title>${esc(x.tip)}</title>${mark}${x.label ? `<text x="${cx + 9}" y="${ya + 4}" font-size="10" fill="var(--ink)">${esc(x.label)}</text>` : ""}</g>`;
    s += x.href ? `<a href="${esc(x.href)}" target="_blank" rel="noopener">${g}</a>` : g;
  }
  const yn = y(now);
  s += `<line x1="${LX}" y1="${yn}" x2="${W}" y2="${yn}" stroke="var(--ink)" stroke-width="1.5"/>` +
    `<text x="0" y="${yn + 4}" font-size="11" font-weight="700" fill="var(--ink)">now</text>`;
  return `<svg viewBox="0 -2 ${W} ${y0 - FOLD + 14}" role="img" aria-label="The branch's timeline: agent steps, commits, CI and the PR, top to bottom">${s}</svg>`;
}

function costHtml(agent) {
  const by = new Map();
  for (const a of agent) {
    const k = a.step || "agent", r = by.get(k) || { n: 0, ms: 0, usd: 0 };
    r.n++;
    r.ms += a.ms || 0;
    r.usd += a.usd || 0;
    by.set(k, r);
  }
  if (!by.size) return "";
  const rows = [...by].sort((a, b) => b[1].usd - a[1].usd);
  const all = rows.reduce((t, [, r]) => ({ n: t.n + r.n, ms: t.ms + r.ms, usd: t.usd + r.usd }), { n: 0, ms: 0, usd: 0 });
  const tr = (name, r, cls = "") => `<tr${cls}><td>${esc(name)}</td><td>${r.n > 1 ? `×${r.n}` : ""}</td><td>${r.ms ? span(r.ms) : ""}</td><td>$${r.usd.toFixed(2)}</td>` +
    `<td>${cls ? "" : `<span class="bar" style="width:${Math.max(2, r.usd / (all.usd || 1) * 100)}%"></span>`}</td></tr>`;
  return `<table class="cost"><caption>The agent's runs</caption>${rows.map(([k, r]) => tr(k, r)).join("")}${rows.length > 1 ? tr("in all", all, ` class="all"`) : ""}</table>`;
}

// Only the latest load draws and retries, for the branch still open.
let tlAgain, tlSeq = 0, tlDrawn = "", tlAt = 0;
async function loadTimeline(id) {
  clearTimeout(tlAgain);
  const mine = ++tlSeq, current = () => mine === tlSeq && openId() === id;
  const body = $("tlbody");
  if (!body.innerHTML) body.innerHTML = `<p class="none">asking GitHub…</p>`;
  try {
    const r = await fetch(`/api/timeline?id=${encodeURIComponent(id)}`, { cache: "no-store" });
    if (!current()) return;
    if (r.status === 404) { body.innerHTML = `<p class="none">${esc(id)} isn't in the watcher's cache any more.</p>`; return; }
    if (!r.ok) throw new Error(r.status);
    const t = await r.json();
    if (!current()) return;
    const ev = tlEvents(t);
    const cut = t.github?.total ? `<p class="none">The last ${t.github.commits.length} of ${t.github.total} commits: the earlier ones aren't drawn.</p>` : "";
    const pr = t.github || t.error || t.refreshing || t.fetched;
    const down = t.error ? `<p class="none">GitHub didn't answer${t.github ? ", so its part is the last answer" : ", so this is the agent's steps only"} (${esc(t.error)})</p>` : "";
    const note = cut + down + (pr ? ghLine(t) : `<p class="none">No PR yet: the agent's steps only.</p>`);
    // Redrawn only when it changed, or every 10 minutes to move "now": a redraw loses the hover and the scroll.
    if (!body.querySelector(".tlsvg")) { body.innerHTML = `<div class="tlnote"></div><div class="tlsvg"></div><div class="tlruns"></div>`; tlDrawn = ""; }
    body.querySelector(".tlnote").innerHTML = note;
    body.querySelector(".tlruns").innerHTML = costHtml(t.agent);
    const drawn = JSON.stringify(ev), now = Date.now();
    if (drawn !== tlDrawn || now - tlAt >= 6e5) {
      body.querySelector(".tlsvg").innerHTML = ev.length ? tlSvg(ev, now) : `<p class="none">Nothing recorded for this branch yet.</p>`;
      tlDrawn = drawn;
      tlAt = now;
    }
    if (t.refreshing) tlAgain = setTimeout(() => { if ($("tl").open && openId() === id && !document.hidden) loadTimeline(id); }, 1000);
  } catch (e) {
    if (current()) body.innerHTML = `<p class="none">can't reach sd view (${esc(e.message)})</p>`;
  }
}

function openId() {
  const m = location.hash.match(/^#b=(.+)$/);
  try { return m ? decodeURIComponent(m[1]) : null; } catch { return null; }
}

async function loadDetail(id) {
  const back = `<button class="back" type="button" data-back>Back to the flock</button>`;
  try {
    const r = await fetch(`/api/branch?id=${encodeURIComponent(id)}`, { cache: "no-store" });
    const b = r.ok ? await r.json() : null;
    if (openId() !== id) return;
    if (r.status === 404) {
      shown = "";
      $("dmain").innerHTML = `${back}<p class="none">${esc(id)} isn't in the watcher's cache any more.</p>`;
    } else if (!r.ok) {
      throw new Error(r.status);
    } else {
      renderDetail(b);
      document.title = `${b.branch}, ${b.repo}`;
    }
  } catch (e) {
    if (openId() !== id) return;
    const eb = $("dsub");
    shown = "";
    if (eb) { eb.classList.add("stale"); eb.textContent = `can't reach sd view (${e.message}): showing the last read`; }
    else $("dmain").innerHTML = `${back}<p class="none">can't reach sd view (${esc(e.message)})</p>`;
  }
}

function route() {
  const id = openId();
  document.body.classList.toggle("drill", !!id);
  $("detail").hidden = !id;
  document.title = "sheepdog flock";
  if (!id) { readFilter(); if (last) render(last); }
  if (id) { $("dmain").innerHTML = ""; shown = ""; $("tl").open = false; $("tlbody").innerHTML = ""; loadDetail(id); window.scrollTo(0, 0); }
}

// Only the latest poll schedules the next: one polling chain, stopped while hidden.
let again, seq = 0;
async function poll(detail) {
  clearTimeout(again);
  if (document.hidden) return;
  const mine = ++seq;
  let soon = false;
  try {
    const r = await fetch("/api/flock", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const f = await r.json();
    if (mine !== seq) return;
    render(f);
    soon = f.refreshing || f.branches.some(b => b.acting);
  } catch (e) {
    if (mine !== seq) return;
    const eb = $("sub");
    eb.classList.add("stale");
    eb.textContent = `can't reach sd view (${e.message}): showing the last read`;
  }
  const id = openId();
  if (detail && id) loadDetail(id);
  if (detail && id && $("tl").open) loadTimeline(id);
  again = setTimeout(() => poll(true), soon ? 2000 : POLL_MS);
}

const openCard = el => { location.hash = "b=" + encodeURIComponent(el.dataset.id); };
document.addEventListener("click", async e => {
  const b = e.target.closest(".copy");
  if (b) {
    try { await navigator.clipboard.writeText(b.dataset.cmd); b.textContent = "copied"; }
    catch {
      const r = document.createRange(); r.selectNodeContents(b.previousElementSibling);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "selected";
    }
    setTimeout(() => (b.textContent = "copy"), 1400);
    return;
  }
  if (e.target.closest("[data-back]")) { location.hash = filterHash(); return; }
  const ft = e.target.closest("[data-who], [data-repo]");
  if (ft) { const k = ft.dataset.who ? "who" : "repo"; setFilter({ [k]: F[k] === ft.dataset[k] ? "" : ft.dataset[k] }); return; }
  if (e.target.closest("[data-refresh]")) { refreshGh().then(() => poll(true), () => {}); return; }
  const a = e.target.closest("[data-act]");
  if (a) { runStep(a); return; }
  const st = e.target.closest("button[data-set]");
  if (st) { setConfig(st.dataset.set, st.previousElementSibling.value); return; }
  if (e.target.closest("a")) return;
  const c = e.target.closest(".run[data-id]");
  if (c) openCard(c);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches?.("input[type=checkbox][data-set]")) setConfig(t.dataset.set, t.checked ? "true" : "false");
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches?.("input[data-path]")) { setConfig(e.target.dataset.path, e.target.value); e.target.blur(); return; }
  if (e.target.id === "q") { if (e.key === "Escape") { e.target.value = ""; setFilter({ q: "" }); e.target.blur(); } return; }
  if (e.key === "/" && !openId() && !e.target.matches?.("input, textarea, select")) { e.preventDefault(); $("q").focus(); return; }
  if (e.key === "Escape" && openId()) location.hash = filterHash();
  else if (e.key === "Enter" && e.target.matches?.(".run[data-id]")) openCard(e.target);
});
$("q").addEventListener("input", e => setFilter({ q: e.target.value }));
$("tl").addEventListener("toggle", () => { if ($("tl").open && openId()) loadTimeline(openId()); });
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(true); });
route();
poll(false);
</script>
</body>
