<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="sd-token" content="__SD_TOKEN__">
<title>sheepdog map</title>
<style>
:root {
  --bg: #eef1f3; --surface: #ffffff; --ink: #17212a; --muted: #5a6670; --line: #d3dade;
  --you: #a87414; --agent: #b0532b; --run: #4c7d36; --wait: #3d6fa8; --red: #c2412d; --done: #7d8a93;
  --f-body: "Atkinson Hyperlegible", "Avenir Next", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181d; --surface: #1a2229; --ink: #e4eaee; --muted: #9aa7b1; --line: #2c3740;
    --you: #d9a443; --agent: #e0835a; --run: #7fb465; --wait: #6f9fd6; --red: #ef7a62; --done: #75828c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12181d; --surface: #1a2229; --ink: #e4eaee; --muted: #9aa7b1; --line: #2c3740;
  --you: #d9a443; --agent: #e0835a; --run: #7fb465; --wait: #6f9fd6; --red: #ef7a62; --done: #75828c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; }
.wrap {
  max-width: 1200px; margin: 0 auto; display: grid; gap: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
h2 { font-size: 1rem; margin: 0; display: flex; align-items: baseline; gap: 8px; font-family: var(--f-mono); }
h2 .n { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.eyebrow { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.eyebrow.stale { color: var(--red); }
.nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.nav a { font-size: 0.88rem; color: var(--muted); text-decoration: none; }
.nav a:hover { color: var(--ink); }
#top { display: grid; gap: 10px; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.sum { display: inline-flex; gap: 8px; align-items: baseline; border: 1.5px solid var(--sc); border-radius: 999px; padding: 4px 12px; font-size: 0.88rem; }
.sum b { font-size: 1.15rem; color: var(--sc); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--muted); align-items: center; }
.legend .k { display: inline-block; width: 13px; height: 13px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); position: relative; }
.legend .k.h { background: repeating-linear-gradient(45deg, var(--agent) 0 2px, var(--surface) 2px 5px); border-color: var(--agent); }
.legend .k.i { border: 0; border-radius: 50%; background: var(--wait); }
#groups { display: grid; gap: 26px; }
.group { display: grid; gap: 10px; }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
.sq {
  position: relative; width: var(--s); height: var(--s); padding: 0; flex: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 3px; cursor: pointer;
  font: inherit; color: var(--muted); text-align: left;
}
.sq.over { border-color: var(--agent); }
.sq:hover, .sq.on { border-color: var(--ink); }
.sq.on { box-shadow: 0 0 0 2px var(--ink); }
.sq:focus-visible { outline: 2px solid var(--wait); outline-offset: 2px; }
.sq .h { position: absolute; left: 0; right: 0; bottom: 0; height: var(--h); border-radius: 0 0 2px 2px;
  background: repeating-linear-gradient(45deg, var(--agent) 0 2px, transparent 2px 6px); }
.sq .nm { position: absolute; left: 5px; top: 3px; right: 5px; font-family: var(--f-mono); font-size: 0.66rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sq .i { position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--wait); color: var(--surface); font: 700 10px/16px var(--f-mono); text-align: center; z-index: 1; }
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; max-height: 60vh; overflow-y: auto; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.12);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#sheet[hidden] { display: none; }
.sbody { max-width: 1200px; margin: 0 auto; display: grid; gap: 12px; }
.shead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.shead b { font-family: var(--f-mono); font-size: 1rem; overflow-wrap: anywhere; }
.x { font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 0 4px; }
.big { display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; }
.big span { font-size: 0.8rem; color: var(--muted); }
.big b { font-size: 1.5rem; font-variant-numeric: tabular-nums; color: var(--ink); margin-right: 4px; }
.head { font-size: 0.82rem; color: var(--muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.head.all { display: block; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 0.8rem; }
.bar code { font-family: var(--f-mono); overflow-wrap: anywhere; }
.bar .v { font-family: var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.bar .track i { position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--agent); border-radius: 3px; }
.bar .track::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--cap); width: 2px; background: var(--ink); }
.iss { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.82rem; }
.iss li { border-left: 3px solid var(--wait); padding-left: 8px; overflow-wrap: anywhere; }
.iss a { color: var(--ink); }
.none { color: var(--muted); font-size: 0.85rem; margin: 0; }
footer { font-size: 0.78rem; color: var(--muted); overflow-wrap: anywhere; }
.ghline { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.refresh { font: inherit; font-size: 0.78rem; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 0.1rem 0.5rem; cursor: pointer; }
body.sheet footer { margin-bottom: 40vh; }
</style>
</head>
<body>
<div class="wrap">
  <header id="top">
    <div class="nav"><a href="/">← Flock</a><span class="eyebrow" id="eyebrow">loading…</span></div>
    <h1>The code</h1>
    <div class="summary" id="summary"></div>
    <div id="gh"></div>
    <div class="legend">
      <span><i class="k"></i>a file: area is lines</span>
      <span><i class="k h"></i>in functions over the cap</span>
      <span><i class="k i"></i>open issues naming it</span>
    </div>
  </header>
  <div id="groups"></div>
  <footer id="foot"></footer>
</div>
<aside id="sheet" hidden aria-live="polite"><div class="sbody" id="sbody"></div></aside>
<script>
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString();
const TOKEN = document.querySelector('meta[name="sd-token"]').content;
const ago = iso => {
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : `${Math.round(s / 3600)}h`;
};
const ghLine = d => `<p class="none ghline">${d.fetched ? `GitHub data ${ago(d.fetched)} old` : "Not asked GitHub yet"}` +
  `${d.refreshing ? " · asking GitHub…" : ""} <button class="refresh" type="button" data-refresh>refresh</button></p>`;
const refreshGh = () => fetch("/api/refresh", { method: "POST", headers: { "X-Sd-Token": TOKEN } });
const CAP = { too_many_lines: 100, cognitive_complexity: 25 };
const LABEL = { too_many_lines: "lines", cognitive_complexity: "complexity" };
const MAX_SIDE = 140, MIN_SIDE = 12;
let files = {};

function tile(f, maxLines) {
  const s = Math.max(MIN_SIDE, Math.round(MAX_SIDE * Math.sqrt(f.lines / maxLines)));
  const share = Math.min(1, f.over_lines / Math.max(f.lines, 1));
  const name = f.path.split("/").pop();
  const hatch = share ? `<span class="h" style="--h:${(share * 100).toFixed(1)}%"></span>` : "";
  const badge = f.issues.length ? `<span class="i">${f.issues.length}</span>` : "";
  const label = s >= 52 ? `<span class="nm">${esc(name)}</span>` : "";
  return `<button class="sq${f.over.length ? " over" : ""}" type="button" style="--s:${s}px" data-p="${esc(f.path)}" ` +
    `title="${esc(f.path)} · ${fmt(f.lines)} lines" aria-label="${esc(f.path)}, ${f.lines} lines">${hatch}${label}${badge}</button>`;
}

function render(m) {
  const all = m.groups.flatMap(g => g.files);
  files = Object.fromEntries(all.map(f => [f.path, f]));
  const lines = all.reduce((n, f) => n + f.lines, 0);
  const maxLines = Math.max(1, ...all.map(f => f.lines));
  $("eyebrow").textContent = `${all.length} files · src/`;
  const chips = [[fmt(lines), "lines", "--ink"], [m.ratchet, "over the cap", "--agent"]];
  if (m.issues !== null) chips.push([m.issues, "open issues", "--wait"]);
  $("summary").innerHTML = chips.map(([n, what, c]) => `<span class="sum" style="--sc:var(${c})"><b>${n}</b>${what}</span>`).join("");
  $("groups").innerHTML = m.groups.length ? m.groups.map(g =>
    `<section class="group"><h2>${esc(g.name)}<span class="n">${fmt(g.lines)}</span></h2>` +
    `<div class="tiles">${g.files.map(f => tile(f, maxLines)).join("")}</div></section>`).join("")
    : `<p class="none">No source here: sd runs from ${esc(m.root)}, which has no src/.</p>`;
  $("gh").innerHTML = ghLine(m);
  const note = m.error ? `Open issues left out: ${m.error}. ` : "";
  $("foot").textContent = `${note}Read from ${m.root}. Tap a file for its functions over the cap and its issues.`;
}

function bars(over) {
  return over.map(o => {
    const cap = CAP[o.lint] || o.score, top = Math.max(o.score, cap);
    return `<li class="bar"><code>${esc(o.fn)}</code><span class="v">${o.score} ${LABEL[o.lint] || esc(o.lint)}</span>` +
      `<span class="track" style="--w:${(o.score / top * 100).toFixed(1)}%;--cap:${(cap / top * 100).toFixed(1)}%"><i></i></span></li>`;
  }).join("");
}

function showFile(path) {
  const f = files[path];
  if (!f) return;
  document.querySelectorAll(".sq.on").forEach(e => e.classList.remove("on"));
  document.querySelector(`.sq[data-p="${CSS.escape(path)}"]`)?.classList.add("on");
  const share = Math.round(Math.min(1, f.over_lines / Math.max(f.lines, 1)) * 100);
  const iss = f.issues.map(i => `<li><a href="${esc(i.url)}" target="_blank" rel="noopener">#${esc(i.number)}</a> ${esc(i.title)}</li>`).join("");
  $("sbody").innerHTML = `<div class="shead"><b>${esc(f.path)}</b><button class="x" type="button" data-close aria-label="close">✕</button></div>
    <div class="big"><span><b>${fmt(f.lines)}</b>lines</span><span><b>${share}%</b>over the cap</span><span><b>${f.issues.length}</b>issues</span></div>
    ${f.head ? `<p class="head" data-more>${esc(f.head)}</p>` : ""}
    ${f.over.length ? `<ul class="bars">${bars(f.over)}</ul>` : ""}
    ${iss ? `<ul class="iss">${iss}</ul>` : ""}`;
  $("sheet").hidden = false;
  document.body.classList.add("sheet");
}

function hideFile() {
  $("sheet").hidden = true;
  document.body.classList.remove("sheet");
  document.querySelectorAll(".sq.on").forEach(e => e.classList.remove("on"));
}

document.addEventListener("click", e => {
  const sq = e.target.closest(".sq[data-p]");
  if (sq) return showFile(sq.dataset.p);
  if (e.target.closest("[data-close]")) return hideFile();
  const more = e.target.closest("[data-more]");
  if (more) more.classList.toggle("all");
  if (e.target.closest("[data-refresh]")) refreshGh().then(load);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") hideFile(); });

let again;
async function load() {
  clearTimeout(again);
  try {
    const r = await fetch("/api/map", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const m = await r.json();
    render(m);
    again = setTimeout(load, m.refreshing ? 1000 : 60000);
  } catch (e) {
    const eb = $("eyebrow");
    eb.classList.add("stale");
    eb.textContent = `can't reach sd view (${e.message})`;
    again = setTimeout(load, 60000);
  }
}
load();
</script>
</body>
</html>
