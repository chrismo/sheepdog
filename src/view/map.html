<!doctype html>
<html lang="en" data-pal="fleece" data-face="londrina">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="sd-token" content="__SD_TOKEN__">
<title>sheepdog map</title>
<link rel="icon" type="image/png" href="/img/sheepdog.png">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
.wrap { max-width: 1200px; }
#top { display: grid; gap: 22px; }
.tally { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; }
.tally span { color: var(--muted); }
.tally b { font-family: var(--f-display); font-weight: var(--w-display); font-size: 2.4rem; line-height: 0.9; color: var(--sc); font-variant-numeric: tabular-nums; margin-right: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 0.85rem; color: var(--muted); align-items: center; }
.legend .k { display: inline-block; width: 13px; height: 13px; vertical-align: -2px; margin-right: 6px; border: 1px solid var(--line); background: var(--surface); }
.legend .k.h { background: repeating-linear-gradient(45deg, var(--agent) 0 2px, var(--surface) 2px 5px); border-color: var(--agent); }
.legend .k.i { border: 0; background: var(--wait); width: 9px; }
#trend { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 36px; border-top: 2px solid var(--ink); padding-top: 12px; }
.series { display: grid; gap: 2px; align-content: start; }
.series .lbl, .series .d, .tnote { font-size: 0.8rem; color: var(--muted); }
.series b { font-family: var(--f-display); font-weight: var(--w-display); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.series svg { width: 100%; height: 44px; display: block; overflow: visible; margin: 4px 0; }
.series path { fill: none; stroke: var(--sc); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.series .hit { fill: transparent; }
.series .hit:hover { fill: var(--line); opacity: 0.5; }
.tnote { grid-column: 1 / -1; margin: 0; }
#groups { display: grid; gap: 30px; }
.group { display: grid; gap: 10px; }
.group h2 { margin: 0; display: flex; align-items: baseline; gap: 10px; font-family: var(--f-display); font-weight: var(--w-display); font-size: 1.6rem; line-height: 1; }
.group h2 .n { font-family: var(--f-body); font-weight: 400; font-size: 0.85rem; color: var(--muted); }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
.sq {
  position: relative; width: var(--s); height: var(--s); padding: 0; flex: none;
  background: var(--surface); border: 1px solid var(--line); cursor: pointer;
  font: inherit; color: var(--muted); text-align: left;
}
.sq.over { border-color: var(--agent); }
.sq:hover, .sq.on { border-color: var(--ink); }
.sq.on { outline: 2px solid var(--ink); outline-offset: 1px; }
.sq .h { position: absolute; left: 0; right: 0; bottom: 0; height: var(--h);
  background: repeating-linear-gradient(45deg, var(--agent) 0 2px, transparent 2px 6px); }
.sq .nm { position: absolute; left: 5px; top: 3px; right: 5px; font-family: var(--f-mono); font-size: 0.66rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sq .i { position: absolute; top: -1px; right: -1px; min-width: 15px; height: 15px; padding: 0 3px;
  background: var(--wait); color: var(--surface); font: 700 10px/15px var(--f-mono); text-align: center; z-index: 1; }
.sbody { max-width: 1200px; margin: 0 auto; display: grid; gap: 12px; }
.shead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.shead b { font-family: var(--f-mono); font-size: 1.05rem; overflow-wrap: anywhere; }
.big { display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline; }
.big span { font-size: 0.82rem; color: var(--muted); }
.big b { font-family: var(--f-display); font-weight: var(--w-display); font-size: 1.8rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); margin-right: 5px; }
.head { font-size: 0.84rem; color: var(--muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.head.all { display: block; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 0.82rem; }
.bar code { overflow-wrap: anywhere; }
.bar .v { font-family: var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar .track { grid-column: 1 / -1; height: 6px; background: var(--line); position: relative; overflow: hidden; }
.bar .track i { position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--agent); }
.bar .track::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--cap); width: 2px; background: var(--ink); }
.iss { list-style: none; margin: 0; padding: 0; display: grid; font-size: 0.84rem; }
.iss li { padding: 5px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.iss li:last-child { border-bottom: 0; }
.iss a { font-weight: 700; color: var(--wait); }
.atl { margin: 0; font-size: 0.84rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.atl a { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink); }
footer { overflow-wrap: anywhere; }
body.sheet footer, body.sheet #look { margin-bottom: 40vh; }
.find { font: inherit; color: var(--ink); background: none; border: 0; border-bottom: 1.5px solid var(--line); border-radius: 0; padding: 4px 0; width: min(100%, 340px); }
.find:focus-visible { outline: none; border-bottom-color: var(--ink); }
.find::placeholder { color: var(--muted); }
.group[hidden] { display: none; }
.sq.miss { opacity: 0.25; }
</style>
</head>
<body>
<div class="wrap">
  <header id="top">
    <div class="mast">
      <img src="/img/sheepdog.png" alt="" width="92" height="92">
      <h1>The code</h1>
      <div class="sub" id="sub">Reading the code</div>
      <nav class="pages"><a href="/">Flock</a><a href="/atlas">Atlas</a><a href="/map" aria-current="page">Map</a></nav>
    </div>
    <div class="tally" id="summary"></div>
    <div id="gh"></div>
    <div class="legend">
      <span><i class="k"></i>a file: area is lines</span>
      <span><i class="k h"></i>in functions over the cap</span>
      <span><i class="k i"></i>open issues naming it</span>
    </div>
  </header>
  <section id="trend" aria-label="trend"></section>
  <input id="q" class="find" type="search" placeholder="find a file" aria-label="find a file by its path" title="/ to find, Escape to clear" autocomplete="off" spellcheck="false">
  <p class="none" id="nomatch" hidden>No file's path holds that.</p>
  <div id="groups"></div>
  <footer id="foot"></footer>
  <div id="look"></div>
</div>
<aside id="sheet" hidden aria-live="polite"><div class="sbody" id="sbody"></div></aside>
<script src="/gh.js"></script>
<script>
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString();
const CAP = { too_many_lines: 100, cognitive_complexity: 25 };
const LABEL = { too_many_lines: "lines", cognitive_complexity: "complexity" };
const MAX_SIDE = 140, MIN_SIDE = 12;
let files = {};
// The trend's series: the point's key, its name, its color token.
const SERIES = [["src", "lines in src/", "--ink"], ["tests", "lines in tests/", "--wait"], ["ratchet", "functions over the cap", "--agent"]];

function tile(f, maxLines) {
  const s = Math.max(MIN_SIDE, Math.round(MAX_SIDE * Math.sqrt(f.lines / maxLines)));
  const share = Math.min(1, f.over_lines / Math.max(f.lines, 1));
  const name = f.path.split("/").pop();
  const hatch = share ? `<span class="h" style="--h:${(share * 100).toFixed(1)}%"></span>` : "";
  const badge = f.issues.length ? `<span class="i">${f.issues.length}</span>` : "";
  const label = s >= 52 ? `<span class="nm">${esc(name)}</span>` : "";
  return `<button class="sq${f.over.length ? " over" : ""}" type="button" style="--s:${s}px" data-p="${esc(f.path)}" ` +
    `title="${esc(f.path)}, ${fmt(f.lines)} lines" aria-label="${esc(f.path)}, ${f.lines} lines">${hatch}${label}${badge}</button>`;
}

function render(m) {
  const open = $("sheet").hidden ? null : document.querySelector(".sq.on")?.dataset.p;
  const expanded = !!document.querySelector("#sbody [data-more].all");
  const all = m.groups.flatMap(g => g.files);
  files = Object.fromEntries(all.map(f => [f.path, f]));
  const lines = all.reduce((n, f) => n + f.lines, 0);
  const maxLines = Math.max(1, ...all.map(f => f.lines));
  const sub = $("sub");
  sub.classList.remove("stale");
  sub.textContent = `${all.length} files under src/, grouped by the stage they serve.`;
  const chips = [[fmt(lines), "lines", "--ink"], [m.ratchet, "functions over the cap", "--agent"]];
  if (m.issues !== null) chips.push([m.issues, "open issues", "--wait"]);
  $("summary").innerHTML = chips.map(([n, what, c]) => `<span style="--sc:var(${c})"><b>${n}</b>${what}</span>`).join("");
  $("groups").innerHTML = m.groups.length ? m.groups.map(g =>
    `<section class="group"><h2>${esc(g.name)}<span class="n">${fmt(g.lines)} lines</span></h2>` +
    `<div class="tiles">${g.files.map(f => tile(f, maxLines)).join("")}</div></section>`).join("")
    : `<p class="none">No source here: sd runs from ${esc(m.root)}, which has no src/.</p>`;
  narrow();
  $("gh").innerHTML = ghLine(m);
  renderTrend(m.trend);
  const down = !m.error ? "" : m.issues === null ? `Open issues left out: ${m.error}. ` : `The open issues are GitHub's last answer: ${m.error}. `;
  const note = down + (m.cut ? `Some open issues may be left out: ${m.cut}. ` : "");
  $("foot").textContent = `${note}Read from ${m.root}. Tap a file for its functions over the cap and its issues.`;
  if (open && !files[open]) hideFile();
  else if (open && JSON.stringify(files[open]) === sheetKey) document.querySelector(`.sq[data-p="${CSS.escape(open)}"]`)?.classList.add("on");
  else if (open) {
    showFile(open);
    if (expanded) document.querySelector("#sbody [data-more]")?.classList.add("all");
  }
  if (!routed) { routed = true; route(); }
}

// One series as a sparkline, each point a hover target naming its day and value.
function spark(points, key) {
  const W = 200, H = 44, n = points.length, step = W / Math.max(n - 1, 1);
  const max = Math.max(1, ...points.map(p => p[key]));
  const x = i => (n > 1 ? i * step : W).toFixed(1), y = v => (H - 2 - (v / max) * (H - 4)).toFixed(1);
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i)} ${y(p[key])}`).join(" ");
  const hits = points.map((p, i) => `<rect class="hit" x="${(x(i) - step / 2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${H}">` +
    `<title>${esc(p.date)}: ${fmt(p[key])}</title></rect>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${fmt(points[0][key])} to ${fmt(points[n - 1][key])}"><path d="${d}"/>${hits}</svg>`;
}

function trendSeries(points, [key, what, c]) {
  const first = points[0], last = points[points.length - 1], d = last[key] - first[key];
  const delta = d ? `${d > 0 ? "+" : "−"}${fmt(Math.abs(d))} since ${esc(first.date)}` : `flat since ${esc(first.date)}`;
  return `<div class="series" style="--sc:var(${c})"><span class="lbl">${what}</span><b>${fmt(last[key])}</b>${spark(points, key)}<span class="d">${delta}</span></div>`;
}

// Must match trendSeries' height, so the files below don't move when the sample lands (#478).
const emptySeries = ([, what]) =>
  `<div class="series"><span class="lbl">${what}</span><b>&nbsp;</b><svg viewBox="0 0 200 44" preserveAspectRatio="none" aria-hidden="true"><path d="M0 42H200" style="stroke:var(--line)"/></svg><span class="d">&nbsp;</span></div>`;

function renderTrend(t) {
  const el = $("trend");
  if (!t.points.length) {
    el.innerHTML = SERIES.map(emptySeries).join("") + `<p class="tnote">${t.error ? `No trend: ${esc(t.error)}` : "Sampling git history…"}</p>`;
    return;
  }
  const note = [`${t.points.length} days, the last commit of each since ${esc(t.points[0].date)}`, t.fetched && `sampled ${ago(t.fetched)} ago`,
    t.refreshing && "sampling again…", t.error && esc(t.error)].filter(Boolean).join("; ");
  el.innerHTML = SERIES.map(s => trendSeries(t.points, s)).join("") + `<p class="tnote">${note}.</p>`;
}

function bars(over) {
  return over.map(o => {
    const cap = CAP[o.lint] || o.score, top = Math.max(o.score, cap);
    return `<li class="bar"><code>${esc(o.fn)}</code><span class="v">${o.score} ${LABEL[o.lint] || esc(o.lint)}</span>` +
      `<span class="track" style="--w:${(o.score / top * 100).toFixed(1)}%;--cap:${(cap / top * 100).toFixed(1)}%"><i></i></span></li>`;
  }).join("");
}

let sheetKey = "";
function showFile(path) {
  const f = files[path];
  if (!f) return;
  sheetKey = JSON.stringify(f);
  document.querySelectorAll(".sq.on").forEach(e => e.classList.remove("on"));
  document.querySelector(`.sq[data-p="${CSS.escape(path)}"]`)?.classList.add("on");
  const share = Math.round(Math.min(1, f.over_lines / Math.max(f.lines, 1)) * 100);
  const iss = f.issues.map(i => `<li><a href="${esc(i.url)}" target="_blank" rel="noopener">#${esc(i.number)}</a> ${esc(i.title)}</li>`).join("");
  $("sbody").innerHTML = `<div class="shead"><b>${esc(f.path)}</b><button class="x" type="button" data-close aria-label="close">✕</button></div>
    <div class="big"><span><b>${fmt(f.lines)}</b>lines</span><span><b>${share}%</b>over the cap</span><span><b>${f.issues.length}</b>issues</span></div>
    ${f.head ? `<p class="head" data-more>${esc(f.head)}</p>` : ""}
    ${f.over.length ? `<ul class="bars">${bars(f.over)}</ul>` : ""}
    ${iss ? `<ul class="iss">${iss}</ul>` : ""}
    ${f.steps?.length ? `<p class="atl"><span>Atlas steps here:</span>${f.steps.map(k => `<a href="/atlas#k=${encodeURIComponent(k)}">${esc(k)}</a>`).join("")}</p>` : ""}`;
  $("sheet").hidden = false;
  document.body.classList.add("sheet");
}

function hideFile() {
  $("sheet").hidden = true;
  document.body.classList.remove("sheet");
  document.querySelectorAll(".sq.on").forEach(e => e.classList.remove("on"));
  if (location.hash) setHash({ q: hashed().q });
}

// #p=<path> opens that file's detail (the Atlas links here), its tile scrolled to;
// q=<text> beside it, or alone, is the find box's.
function hashed() {
  const h = {};
  for (const [, k, v] of location.hash.matchAll(/[#&](p|q)=([^&]*)/g)) {
    try { h[k] = decodeURIComponent(v); } catch {}
  }
  return h;
}
const hashOf = h => Object.entries(h).filter(([, v]) => v).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join("&");
const setHash = h => { const s = hashOf(h); history.replaceState(null, "", s ? "#" + s : location.pathname); };

function narrow() {
  const q = $("q").value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".group").forEach(g => {
    const sqs = [...g.querySelectorAll(".sq")];
    sqs.forEach(sq => sq.classList.toggle("miss", !sq.dataset.p.toLowerCase().includes(q)));
    g.hidden = sqs.every(sq => sq.classList.contains("miss"));
    shown += !g.hidden;
  });
  $("nomatch").hidden = !q || shown > 0;
}

function find(v) {
  $("q").value = v;
  setHash({ p: hashed().p, q: v });
  narrow();
}
$("q").addEventListener("input", e => find(e.target.value));

let routed = false;
function route() {
  const { p, q = "" } = hashed();
  if ($("q").value !== q) { $("q").value = q; narrow(); }
  if (!p || !files[p]) return;
  showFile(p);
  document.querySelector(".sq.on")?.scrollIntoView({ block: "center" });
}
window.addEventListener("hashchange", route);

document.addEventListener("click", e => {
  const sq = e.target.closest(".sq[data-p]");
  if (sq) {
    // the URL names the open file, so a reload or Back from its Atlas link reopens it
    setHash({ p: sq.dataset.p, q: hashed().q });
    return showFile(sq.dataset.p);
  }
  if (e.target.closest("[data-close]")) return hideFile();
  const more = e.target.closest("[data-more]");
  if (more) more.classList.toggle("all");
  if (e.target.closest("[data-refresh]")) refreshGh().then(load, () => {});
});
// The same keys as the Flock's filter.
document.addEventListener("keydown", e => {
  const box = $("q");
  if (e.target === box) { if (e.key === "Escape") { if (box.value) find(""); box.blur(); } return; }
  if (e.key === "/" && !e.target.closest("input, select, textarea")) { e.preventDefault(); box.focus(); }
  else if (e.key === "Escape") hideFile();
});

// Only the latest load schedules the next: one polling chain.
let again, seq = 0;
async function load() {
  clearTimeout(again);
  if (document.hidden) return;
  const mine = ++seq;
  try {
    const r = await fetch("/api/map", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const m = await r.json();
    if (mine !== seq) return;
    render(m);
    again = setTimeout(load, m.refreshing || m.trend.refreshing ? 1000 : 60000);
  } catch (e) {
    if (mine !== seq) return;
    const sub = $("sub");
    sub.classList.add("stale");
    sub.textContent = `can't reach sd view (${e.message})`;
    again = setTimeout(load, 60000);
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
