on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/chrismo/sheepdog.git
      ref: ${{ init.commit-sha }}

  # Scripts run `#!/usr/bin/env bash5`; Ubuntu's bash 5.2 is new enough.
  # uuid-runtime provides uuidgen; procps, ps (proc_start).
  - key: system-packages
    run: |
      sudo apt-get update
      sudo apt-get install -y git jq parallel procps uuid-runtime
      sudo apt-get clean
      sudo ln -sfn /bin/bash /usr/local/bin/bash5
      bash5 --version | head -1

  # Pinned to what dev runs; apt's bats is 1.10.
  - key: bats
    run: |
      git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core.git
      sudo ./bats-core/install.sh /usr/local
      rm -rf bats-core
      bats --version

  # lib/config.sh needs exactly 0.3.0, and lib/config.bats skips its super tests
  # unless a real binary is at the asdf install path.
  - key: superdb
    run: |
      dir="$HOME/.asdf/installs/superdb/0.3.0/bin"
      mkdir -p "$dir"
      curl -fsSL https://github.com/brimdata/super/releases/download/v0.3.0/super-v0.3.0.linux-amd64.tar.gz \
        | tar -xz -C "$dir" super
      "$dir/super" -version
      echo "$dir:$PATH" > "$RWX_ENV/PATH"
      echo 'superdb 0.3.0' > "$HOME/.tool-versions"

  - key: captain
    call: rwx/install-captain 1.2.0

  # Ported verbs' libexec/sd-<verb> links to target/release/sd (#193).
  - key: rust
    call: rust-lang/install 1.1.1
    with:
      rust-version: 1.90.0

  - key: build
    use: [code, rust]
    run: cargo build --release --locked
    filter:
      - Cargo.toml
      - Cargo.lock
      - src/**

  # tests/config.rs runs the binary against temp git repos, hence git;
  # tests/next.rs applies jq edits to its state, as lib/next.bats did.
  # tests/state.rs adds a fake gh (bash, jq), and runs lib/*.sh's proc_start
  # (ps) and worktree_mark under bash5 to write what the bash steps write.
  # The agent steps read the shipped prompts from lib/ at run time.
  - key: cargo-test
    use: [code, system-packages, rust]
    run: cargo test --locked
    filter:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - lib/*.sh
      - lib/prompts/**
      - lib/review-rules.md

  - key: test
    use: [code, system-packages, bats, superdb, captain, build]
    runner:
      cpus: 16
    run: |
      git config --global user.name ci
      git config --global user.email ci@example.com
      git config --global init.defaultBranch main
      captain run sheepdog
    filter:
      - "!docs/**"
      - "!README.md"
    outputs:
      test-results:
        - path: test-results/captain-results.json
