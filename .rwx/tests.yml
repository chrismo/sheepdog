on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/chrismo/sheepdog.git
      ref: ${{ init.commit-sha }}

  # src/running.rs runs ps (procps). The tests run git, jq, and fixtures in
  # bash and sh; tests/act_restack.rs's fixtures edit files with perl.
  - key: system-packages
    run: |
      sudo apt-get update
      sudo apt-get install -y git jq perl procps
      sudo apt-get clean

  - key: rust
    call: rust-lang/install 1.1.1
    with:
      rust-version: 1.90.0

  # The one test task: cargo test builds its own debug sd and runs src/'s unit
  # tests and tests/*.rs against it.
  # tests/config.rs runs the binary against temp git repos, hence git;
  # tests/next.rs applies jq edits to its state; tests/state.rs adds a fake gh
  # (bash, jq). The agent steps read the shipped prompts and review rules from
  # lib/ at run time; tests/install.rs copies install.sh; tests/links.rs reads
  # the bin/sd link.
  - key: cargo-test
    use: [code, system-packages, rust]
    run: cargo test --locked
    filter:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - lib/prompts/**
      - lib/review-rules.md
      - bin/sd
      - install.sh
